<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lignum · namještaj po mjeri, praćenje proizvodnje (demo)</title>
<style>
  :root{
    --brand:#9a3412; --brand2:#c2410c; --accent:#0f766e; --action:#c2410c;
    --bg:#f7f4f1; --card:#fff; --line:#e7ded6; --muted:#6b5d52; --text:#241a12;
    --ok:#15803d; --warn:#b45309; --late:#b91c1c; --track:#f0e9e3;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:11px 20px;display:flex;align-items:center;gap:13px}
  .monogram{width:38px;height:38px;border-radius:9px;border:2px solid #fdba74;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
  .brand .name{font-weight:800;font-size:16px;line-height:1}
  .brand .tag{font-size:11.5px;color:#fed7aa;letter-spacing:.3px;margin-top:3px}
  header .spacer{flex:1}
  header select{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:7px;padding:5px 8px;font-size:12px;font-weight:700;cursor:pointer}
  header select option{color:#241a12}
  .user{display:flex;align-items:center;gap:8px;font-size:13px}
  .avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;background:#0f766e}
  .toolbar{display:flex;align-items:center;gap:6px;padding:0 20px;border-bottom:1px solid var(--line);background:#fff;flex-wrap:wrap}
  .tab{padding:14px 12px 12px;font-size:15px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
  .tab.active{color:var(--brand);border-bottom-color:#ea580c}
  .demo-flag{margin-left:10px;background:#ffedd5;color:#9a3412;border:1px solid #fed7aa;padding:4px 10px;border-radius:6px;font-size:12px;align-self:center}
  .newbtn{margin-left:auto;background:var(--action);color:#fff;border:0;padding:8px 13px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;align-self:center}
  .newbtn:hover{filter:brightness(1.08)}
  .wrap{padding:16px 20px}
  .frow{margin-bottom:12px;display:flex;flex-direction:column;gap:4px}
  .frow label{font-size:13px;color:var(--muted);font-weight:600}
  .frow select,.frow input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--text)}
  .frow select:focus,.frow input:focus{outline:none;border-color:var(--brand2)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .viewhead{display:flex;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
  .viewhead h3{margin:0;font-size:15px;color:var(--brand)}
  .viewhead .sub{font-size:13px;color:var(--muted)}
  .filterbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .filterbar input,.filterbar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:var(--text)}
  .filterbar input{flex:0 1 250px}

  .board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
  .col{flex:0 0 234px;background:#fbf8f5;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
  .col.done{background:#f0fdf9;border-color:#99f6e4}
  .col-h{padding:10px 12px;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
  .col.done .col-h{color:var(--accent)}
  .wip{background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:12px;color:var(--muted);font-weight:600}
  .col-body{padding:10px;display:flex;flex-direction:column;gap:9px;min-height:70px}
  .card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:10px;padding:9px 11px;cursor:pointer;box-shadow:0 1px 2px rgba(60,40,20,.08);transition:.1s}
  .card:hover{box-shadow:0 4px 12px rgba(60,40,20,.16);transform:translateY(-1px)}
  .card.pr-visok{border-left-color:#dc2626}
  .card.pr-srednji{border-left-color:#d97706}
  .card.pr-nizak{border-left-color:#64748b}
  .card.blok{background:#fff7f7}
  .card .cid{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .card .cp{font-weight:700;font-size:13.5px;margin:2px 0 1px}
  .card .ck{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .cd{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .crow{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}
  .card .adv{border:0;background:var(--brand);color:#fff;border-radius:6px;min-width:26px;height:24px;cursor:pointer;font-size:13px;font-weight:700}
  .card .adv:hover{filter:brightness(1.1)}
  .pbar{height:4px;background:var(--track);border-radius:3px;margin-top:8px;overflow:hidden}
  .pbar span{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand))}
  .due{font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
  .due.late{color:var(--late)}
  .due.urg{color:var(--warn)}
  .behind{color:#b45309;font-weight:600}
  .blokbadge{color:#b91c1c;font-weight:600}

  .tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
  .tbl thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);padding:11px 14px;background:var(--track);border-bottom:1px solid var(--line)}
  .tbl td{padding:11px 14px;border-bottom:1px solid var(--line)}
  .tbl tbody tr{cursor:pointer}
  .tbl tbody tr:hover{background:var(--track)}
  .tbl tbody tr:last-child td{border-bottom:0}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
  .p-visok{background:#fee2e2;color:#b91c1c}
  .p-srednji{background:#ffedd5;color:#9a3412}
  .p-nizak{background:#e2e8f0;color:#334155}
  .p-faza{background:#e0e7ff;color:#3730a3}
  .p-done{background:#ccfbf1;color:#0f766e}
  .p-ok{background:#dcfce7;color:#166534}
  .muted{color:var(--muted)}
  .link{color:var(--brand2);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
  .miniprog{display:flex;align-items:center;gap:8px}
  .miniprog .mp{width:74px;height:6px;background:var(--track);border-radius:4px;overflow:hidden}
  .miniprog .mp span{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand))}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .big{font-size:23px;font-weight:800;color:var(--brand)}
  .kpi .lab{font-size:13px;color:var(--muted);margin-top:4px}
  .kpi.warn .big{color:var(--late)}
  .kpi.clk{cursor:pointer;transition:.12s}
  .kpi.clk:hover{border-color:var(--brand2);box-shadow:0 3px 12px rgba(120,60,20,.12);transform:translateY(-1px)}
  @media(max-width:820px){.row2{grid-template-columns:1fr}}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .panel h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.3px;color:var(--brand)}
  .bar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px}
  .bar .blab{width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .track{flex:1;background:var(--track);border-radius:6px;height:18px;overflow:hidden}
  .bar .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand2),var(--brand));min-width:2px}
  .bar.clk-bar{cursor:pointer;border-radius:6px;padding:2px 4px;margin:5px -4px}
  .bar.clk-bar:hover{background:var(--track)}
  .bar .val{width:100px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

  .overlay{position:fixed;inset:0;background:rgba(40,20,8,.5);display:none;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto;z-index:50}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:640px;width:100%;box-shadow:0 20px 60px rgba(40,20,8,.35);overflow:hidden}
  .mhead{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:16px 20px;display:flex;align-items:flex-start;gap:12px}
  .mhead h2{margin:0;font-size:19px}
  .mhead .x{margin-left:auto;cursor:pointer;font-size:22px;opacity:.85}
  .mbody{padding:18px 20px;overflow-x:auto}
  .blokbanner{background:#fee2e2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:10px;font-weight:600}
  .kv{display:flex;font-size:14.5px;padding:4px 0}
  .kv .k{width:120px;color:var(--muted)}
  .sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--brand);font-weight:700;margin:16px 0 8px}
  .stepper{display:flex;flex-wrap:wrap;gap:6px}
  .step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .step .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:#fff}
  .step.done .dot{background:var(--brand);border-color:var(--brand);color:#fff}
  .step.cur .dot{border-color:var(--brand);color:var(--brand)}
  .step.cur{color:var(--brand);font-weight:700}
  .step .arr{color:var(--line)}
  .prilozi{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .pchip{display:flex;align-items:center;gap:8px;background:#fbf8f5;border:1px solid var(--line);border-radius:8px;padding:5px 10px 5px 6px;font-size:12.5px}
  .pchip img{cursor:pointer;display:block}
  .pchip-ic{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:6px;font-size:16px}
  .lines{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
  .lines th,.lines td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
  .lines td.num,.lines th.num{text-align:right}
  .actions{padding:14px 20px;background:#fbf8f5;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  button.primary{background:var(--action);color:#fff;border:0;padding:10px 15px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px}
  button.primary:hover{filter:brightness(1.08)}
  button.secondary{background:#fff;color:var(--brand);border:1px solid #e0cdbe;padding:9px 13px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13.5px}
  button.secondary:hover{background:#f7efe8}
  .hint{font-size:12.5px;color:var(--muted)}
  footer{padding:16px 20px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>

  <div class="monogram">LG</div>
  <div class="brand">
    <div class="name">Lignum</div>
    <div class="tag" id="brandTag">Namještaj po mjeri</div>
  </div>
  <div class="spacer"></div>
  <select id="langSel" onchange="setLang(this.value)" title="Jezik / Language">

  </select>
  <div class="user"><span class="avatar" id="userAv">MJ</span><span id="userName">Marko Jurić, proizvodnja</span></div>
</header>

<div class="toolbar">
  <div class="tab active" data-view="tabla" onclick="setView('tabla')">Tabla</div>
  <div class="tab" data-view="nalozi" onclick="setView('nalozi')">Nalozi</div>
  <div class="tab" data-view="materijal" onclick="setView('materijal')">Materijal</div>
  <div class="tab" data-view="faze" onclick="setView('faze')">Faze</div>
  <div class="tab" data-view="pregled" onclick="setView('pregled')">Pregled</div>
  <button class="newbtn" id="newBtn" onclick="openNoviNalog()">+ Novi nalog</button>
  <span class="demo-flag" id="demoFlag">DEMO · izmišljeni podaci</span>
</div>

<div id="view" class="wrap"></div>
<footer id="footer">Demo prototip · podaci su izmišljeni · © Datamaks</footer>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">

</div>

const SEED_BOM={ "RN-1042":[{m:"M1",kol:14},{m:"M3",kol:60},{m:"M4",kol:24},{m:"M5",kol:10},{m:"M8",kol:12},{m:"M7",kol:6}], "RN-1041":[{m:"M2",kol:20},{m:"M3",kol:40},{m:"M5",kol:6}], "RN-1040":[{m:"M1",kol:8},{m:"M6",kol:4}], "RN-1039":[{m:"M1",kol:10}], "RN-1037":[{m:"M1",kol:12},{m:"M8",kol:4}], "RN-1036":[{m:"M2",kol:16},{m:"M4",kol:18}], "RN-1029":[{m:"M2",kol:24}], "RN-1028":[{m:"M2",kol:22},{m:"M4",kol:16},{m:"M6",kol:2}] };
const SEED_BLOK={ "RN-1036":0, "RN-1029":1 };

// ---- Jezik + init ---------------------------------------------------------
let LANG=(new URLSearchParams(location.search).get("lang")||localStorage.getItem("ln_lang")||"bs").toLowerCase();
if(!STR[LANG]) LANG="bs";
const el=id=>document.getElementById(id);
const t=k=>STR[LANG][k];
const m2=n=>String(n).padStart(2,"0");
function computeRokFaze(n){ const begin=-n.start, win=Math.max(n.rok-begin,1); n.rokFaze=[]; for(let i=0;i<LAST;i++) n.rokFaze[i]=Math.round(begin+(i+1)/LAST*win); }
NALOZI.forEach(n=>{ n.prilozi=SEED_PRILOZI[n.id]||[]; n.bom=SEED_BOM[n.id]||[]; n.blok=(n.id in SEED_BLOK)?SEED_BLOK[n.id]:null; n.isporuka=null; computeRokFaze(n); });
(function(){ const n=NALOZI.find(x=>x.id==="RN-1027"); if(n) n.isporuka={datum:3, adresaKey:true, tim:0, status:"zakazano"}; })();

// ---- Lokalizovani pristupnici ---------------------------------------------
const FZ=()=>FAZE_L[LANG]||FAZE_L.bs;
const prioName=pr=>(PRIO_L[LANG]||PRIO_L.bs)[pr];
const razName=i=>(RAZLOZI_L[LANG]||RAZLOZI_L.bs)[i];
const timName=i=>(MONTAZERI_L[LANG]||MONTAZERI_L.bs)[i];
const kn=k=>(KDATA[LANG]||KDATA.bs)[k];
const od=id=>(ODATA[LANG]||ODATA.bs)[id]||{naziv:id,dim:"",mat:""};
const mName=m=>(MNAMES[LANG]||MNAMES.bs)[m].n;
const mJed=m=>(MNAMES[LANG]||MNAMES.bs)[m].jed;
const money=v=>{ const c=CURR[t("curr")]; const loc=LANG==="en"?"en-US":"de-DE"; return Math.round(v*c.rate).toLocaleString(loc)+c.suf; };
const isBlok=n=>n.blok!=null;
const isporAdr=n=>n.isporuka.adresaKey?(ADRESE[LANG]||ADRESE.bs):n.isporuka.adresa;

function dateFromOff(off){ const d=new Date(); d.setDate(d.getDate()+off); return d; }
function fmtDate(off){ const d=dateFromOff(off); return d.getDate()+"."+m2(d.getMonth()+1)+"."; }
function ymdOff(off){ const d=dateFromOff(off); return d.getFullYear()+"-"+m2(d.getMonth()+1)+"-"+m2(d.getDate()); }
const isDone=n=>n.faza>=LAST;
const isLate=n=>!isDone(n)&&n.rok<0;
const fazaBehind=n=> !isDone(n) && !isBlok(n) && n.rokFaze[n.faza] < 0;
const needsDelivery=n=> isDone(n) && (!n.isporuka || n.isporuka.status!=="isporuceno");
const progress=n=>Math.round(n.faza/LAST*100);
function rokInfo(n){
  if(isDone(n)) return {txt:t("rGotovo")+" "+fmtDate(n.rok), cls:""};
  if(n.rok<0)  return {txt:t("rKasni")+" "+(-n.rok)+" "+t("dK"), cls:"late"};
  if(n.rok===0)return {txt:t("rDanas"), cls:"urg"};
  return {txt:t("rZa")+" "+n.rok+" "+t("dK"), cls:""};
}
const fazaPill=n=> isDone(n)?`<span class="pill p-done">${FZ()[LAST]}</span>`:`<span class="pill p-faza">${FZ()[n.faza]}</span>`;
const prioPill=pr=>`<span class="pill p-${pr}">${prioName(pr)}</span>`;

// ---- Jezik ----------------------------------------------------------------
function setLang(l){ if(!STR[l])return; LANG=l; localStorage.setItem("ln_lang",l); closeModal(); applyStatic(); rerender(); }
function applyStatic(){
  document.documentElement.lang=LANG;
  document.title=t("title");
  el("brandTag").textContent=t("tag");
  el("userAv").textContent=t("userInit");
  el("userName").textContent=t("userName");
  el("demoFlag").textContent=t("demo");
  el("newBtn").textContent=t("newNalog");
  el("footer").textContent=t("footer");
  el("langSel").value=LANG;
  const tabs={tabla:"tab_tabla",nalozi:"tab_nalozi",materijal:"tab_materijal",faze:"tab_faze",pregled:"tab_pregled"};
  document.querySelectorAll(".tab").forEach(tb=>tb.textContent=t(tabs[tb.dataset.view]));
}

// ---- Filteri --------------------------------------------------------------
let flt={q:"",kupac:"",prio:"",flag:""};
function filterNalozi(arr){
  return arr.filter(n=>{
    if(flt.kupac && n.k!==flt.kupac) return false;
    if(flt.prio && n.pr!==flt.prio) return false;
    if(flt.flag==="kasni" && !isLate(n)) return false;
    if(flt.flag==="blok" && !isBlok(n)) return false;
    if(flt.flag==="izaplana" && !fazaBehind(n)) return false;
    const q=flt.q.trim().toLowerCase();
    if(q && !(n.id.toLowerCase().includes(q)||od(n.id).naziv.toLowerCase().includes(q)||kn(n.k).toLowerCase().includes(q))) return false;
    return true;
  });
}
function clearFlt(){ flt={q:"",kupac:"",prio:"",flag:""}; rerender(); }
function filterBar(){
  const kOpts=`<option value="">${t("fSviNaruc")}</option>`+Object.keys(KDATA.bs).map(k=>`<option value="${k}"${flt.kupac===k?' selected':''}>${kn(k)}</option>`).join("");
  const pOpts=`<option value="">${t("fSviPrio")}</option>`+["visok","srednji","nizak"].map(p=>`<option value="${p}"${flt.prio===p?' selected':''}>${prioName(p)}</option>`).join("");
  const fPairs=[["","fSvi"],["kasni","fKasni"],["blok","fBlok"],["izaplana","fIzaPlana"]];
  const fOpts=fPairs.map(([v,l])=>`<option value="${v}"${flt.flag===v?' selected':''}>${t(l)}</option>`).join("");
  const active=flt.q||flt.kupac||flt.prio||flt.flag;
  return `<div class="filterbar">
    <input id="fq" placeholder="${t("fSearch")}" value="${flt.q.replace(/"/g,'&quot;')}" oninput="flt.q=this.value;refreshList()">
    <select onchange="flt.kupac=this.value;refreshList()">${kOpts}</select>
    <select onchange="flt.prio=this.value;refreshList()">${pOpts}</select>
    <select onchange="flt.flag=this.value;refreshList()">${fOpts}</select>
    ${active?`<button class="secondary" onclick="clearFlt()">${t("fPonisti")}</button>`:''}
  </div>`;
}
function refreshList(){ if(currentView==="tabla") fillTabla(); else if(currentView==="nalozi") fillNalozi(); }

// ---- View switching -------------------------------------------------------
let currentView="tabla";
function setView(v){
  currentView=v;
  document.querySelectorAll(".tab").forEach(tb=>tb.classList.toggle("active",tb.dataset.view===v));
  rerender();
}
function rerender(){
  if(currentView==="tabla") renderTabla();
  else if(currentView==="nalozi") renderNalozi();
  else if(currentView==="materijal") renderMaterijal();
  else if(currentView==="faze") renderFaze();
  else renderPregled();
}
function closeModal(){el("overlay").classList.remove("open");}
function openModalHTML(html){ el("modal").innerHTML=html; el("overlay").classList.add("open"); }

// ---- Tabla ----------------------------------------------------------------
function renderTabla(){
  el("view").innerHTML=`
    <div class="viewhead"><h3>${t("tablaTitle")}</h3><span class="sub">${t("tablaSub")}</span></div>
    ${filterBar()}
    <div id="dyn"></div>`;
  fillTabla();
}
function fillTabla(){
  const vis=filterNalozi(NALOZI);
  const cols=FZ().map((f,idx)=>{
    const items=vis.filter(n=>n.faza===idx);
    const cards=items.map(n=>{
      const ri=rokInfo(n);
      const canAdv=n.faza<LAST;
      const adv = isBlok(n)?'<span class="pill p-visok">⛔</span>':(canAdv?`<button class="adv" onclick="event.stopPropagation();advance('${n.id}',1)">›</button>`:'<span class="pill p-done">✓</span>');
      return `<div class="card pr-${n.pr}${isBlok(n)?' blok':''}" onclick="openNalog('${n.id}')">
        <div class="cid">${n.id} · ${money(n.vr)}</div>
        <div class="cp">${od(n.id).naziv}</div>
        <div class="ck">${kn(n.k)}</div>
        <div class="cd">${od(n.id).dim}</div>
        ${isBlok(n)?`<div class="cd blokbadge">⛔ ${razName(n.blok)}</div>`:''}
        ${fazaBehind(n)?`<div class="cd behind">${t("cBehind")}</div>`:''}
        ${isDone(n)&&n.isporuka?`<div class="cd">🚚 ${n.isporuka.status==='isporuceno'?t("dispIsporuceno"):t("dispZakazano")} ${fmtDate(n.isporuka.datum)}</div>`:''}
        <div class="crow"><span class="due ${ri.cls}">${ri.txt}</span>${adv}</div>
        <div class="pbar"><span style="width:${progress(n)}%"></span></div>
      </div>`;
    }).join("")||'<div class="hint" style="padding:6px 2px">—</div>';
    return `<div class="col${idx===LAST?' done':''}"><div class="col-h"><span>${f}</span><span class="wip">${items.length}</span></div><div class="col-body">${cards}</div></div>`;
  }).join("");
  el("dyn").innerHTML=`<div class="board">${cols}</div>`;
}
function advance(id, dir){
  const n=NALOZI.find(x=>x.id===id);
  if(dir>0 && isBlok(n)){ alert(t("blokPrefix")+razName(n.blok)); return; }
  const ni=n.faza+dir;
  if(ni<0||ni>LAST) return;
  n.faza=ni; rerender();
}

// ---- Detalj naloga --------------------------------------------------------
function openNalog(id){
  const n=NALOZI.find(x=>x.id===id);
  const o=od(id), ri=rokInfo(n);
  const rokColor = ri.cls==='late'?'var(--late)':ri.cls==='urg'?'var(--warn)':'inherit';
  const steps=FZ().map((f,i)=>{
    const cls=i<n.faza?"done":(i===n.faza?"cur":"");
    const mark=i<n.faza?"✓":(i+1);
    return `<span class="step ${cls}"><span class="dot">${mark}</span>${f}</span>${i<LAST?'<span class="arr">›</span>':''}`;
  }).join("");
  const rokFazeHtml = FZ().map((f,i)=>{
      if(i===LAST) return `<tr><td>${f}</td><td class="num">${fmtDate(n.rok)}</td><td>${isDone(n)?'<span class="pill p-done">'+t("stGotovo")+'</span>':'<span class="muted">'+t("stCilj")+'</span>'}</td></tr>`;
      let st;
      if(i<n.faza) st='<span class="muted">'+t("stZavrseno")+'</span>';
      else if(i===n.faza) st = n.rokFaze[i]<0 ? '<span class="behind">'+t("stIzaPlana")+'</span>' : '<span class="muted">'+t("stUToku")+'</span>';
      else st='<span class="muted">—</span>';
      return `<tr><td>${f}</td><td class="num">${fmtDate(n.rokFaze[i])}</td><td>${st}</td></tr>`;
    }).join("");
  const bomHtml = (n.bom&&n.bom.length)?`<div class="sec-title">${t("secBom")}</div>
    <table class="lines"><thead><tr><th>${t("thMaterijal")}</th><th class="num">${t("thKolicina")}</th><th>${t("thZaliha")}</th></tr></thead><tbody>${n.bom.map(b=>{const m=MATERIJALI[b.m];const low=m.zaliha<m.min;return `<tr><td>${mName(b.m)}</td><td class="num">${b.kol} ${mJed(b.m)}</td><td>${low?'<span class="pill p-srednji">'+t("mNisko")+'</span>':'<span class="muted">'+t("mOk")+'</span>'}</td></tr>`;}).join("")}</tbody></table>`:'';
  const prilogHtml = n.prilozi.length ? n.prilozi.map(p=>{
      const ic=p.t==="foto"?"🖼":p.t==="nacrt"?"📐":"📄";
      const thumb=p.url?`<img src="${p.url}" style="width:34px;height:34px;object-fit:cover;border-radius:6px;border:1px solid var(--line)" onclick="window.open('${p.url}')">`:`<span class="pchip-ic">${ic}</span>`;
      return `<div class="pchip">${thumb}<span>${p.n}</span></div>`;
    }).join("") : '<span class="hint">'+t("prilNema")+'</span>';
  const isporukaHtml = isDone(n)?`<div class="sec-title">${t("secIsporuka")}</div>${n.isporuka?
      `<div class="kv"><span class="k">${t("lDatum")}</span><span>${fmtDate(n.isporuka.datum)}</span></div>
       <div class="kv"><span class="k">${t("lAdresa")}</span><span>${isporAdr(n)}</span></div>
       <div class="kv"><span class="k">${t("lTim")}</span><span>${timName(n.isporuka.tim)}</span></div>
       <div class="kv"><span class="k">${t("thStatus")}</span><span>${n.isporuka.status==='isporuceno'?'<span class="pill p-done">'+t("dispIsporuceno")+'</span>':'<span class="pill p-faza">'+t("dispZakazano")+'</span>'}</span></div>`
     :'<span class="hint">'+t("isporNema")+'</span>'}`:'';
  let actions='';
  if(isDone(n)){
    if(!n.isporuka) actions=`<button class="primary" onclick="openIsporuka('${n.id}')">${t("actZakazi")}</button><button class="secondary" onclick="advance('${n.id}',-1);openNalog('${n.id}')">${t("actVrati")}</button>`;
    else if(n.isporuka.status==="zakazano") actions=`<button class="primary" onclick="markIsporuceno('${n.id}')">${t("actOznaci")}</button><button class="secondary" onclick="openIsporuka('${n.id}')">${t("actIzmijeni")}</button>`;
    else actions=`<span class="hint">${t("dispIsporuceno")} ${fmtDate(n.isporuka.datum)}. ${t("actIsporucenoDone")}</span>`;
  } else if(isBlok(n)){
    actions=`<button class="primary" onclick="deblokiraj('${n.id}')">${t("actDeblokiraj")}</button><span class="hint">${t("blokPrefix")}${razName(n.blok)}. ${t("hintBlok")}</span>`;
  } else {
    actions=`<button class="primary" onclick="advance('${n.id}',1);openNalog('${n.id}')">${t("actSljedeca")}${FZ()[n.faza+1]}</button>`;
    if(n.faza>0) actions+=`<button class="secondary" onclick="advance('${n.id}',-1);openNalog('${n.id}')">${t("actVrati")}</button>`;
    actions+=`<button class="secondary" onclick="openBlok('${n.id}')">${t("actBlokiraj")}</button>`;
  }
  openModalHTML(`
    <div class="mhead"><div><h2>${o.naziv}</h2><div style="font-size:13px;opacity:.9;margin-top:4px">${n.id} · ${kn(n.k)}</div></div><div class="x" onclick="closeModal()">×</div></div>
    <div class="mbody">
      ${isBlok(n)?`<div class="blokbanner">⛔ ${t("blokPrefix")}${razName(n.blok)}</div>`:''}
      <div class="kv"><span class="k">${t("lFaza")}</span><span>${fazaPill(n)} <span class="muted">(${progress(n)}%)</span></span></div>
      <div class="kv"><span class="k">${t("lPrioritet")}</span><span>${prioPill(n.pr)}</span></div>
      <div class="kv"><span class="k">${t("lRok")}</span><span><b style="color:${rokColor}">${ri.txt}</b> · ${fmtDate(n.rok)}</span></div>
      <div class="kv"><span class="k">${t("lNarucilac")}</span><span>${kn(n.k)}</span></div>
      <div class="kv"><span class="k">${t("lDimenzije")}</span><span>${o.dim}</span></div>
      <div class="kv"><span class="k">${t("lOpisMat")}</span><span>${o.mat}</span></div>
      <div class="kv"><span class="k">${t("lVrijednost")}</span><span><b>${money(n.vr)}</b></span></div>
      <div class="sec-title">${t("secTok")}</div>
      <div class="stepper">${steps}</div>
      <div class="sec-title">${t("secRokFaze")}</div>
      <table class="lines"><thead><tr><th>${t("thFaza")}</th><th class="num">${t("thPlanRok")}</th><th>${t("thStatus")}</th></tr></thead><tbody>${rokFazeHtml}</tbody></table>
      ${bomHtml}
      ${isporukaHtml}
      <div class="sec-title">${t("secPrilozi")}</div>
      <div class="prilozi">${prilogHtml}</div>
      <button class="secondary" onclick="addPrilog('${n.id}')">${t("dodajPrilog")}</button>
    </div>
    <div class="actions">${actions}</div>`);
}
function addPrilog(id){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*,.pdf,.doc,.docx";
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
    const n=NALOZI.find(x=>x.id===id);
    const isImg=f.type.indexOf("image/")===0;
    const t2=isImg?"foto":(/\.pdf$/i.test(f.name)?"nacrt":"dokument");
    n.prilozi.push({n:f.name, t:t2, url:isImg?URL.createObjectURL(f):null});
    openNalog(id);
  };
  inp.click();
}

// ---- Blokada / isporuka ---------------------------------------------------
function openBlok(id){
  const opts=(RAZLOZI_L[LANG]||RAZLOZI_L.bs).map((r,i)=>`<option value="${i}">${r}</option>`).join("");
  openModalHTML(`
    <div class="mhead"><div><h2>${t("blokTitle")}</h2><div style="font-size:13px;opacity:.9;margin-top:4px">${id}</div></div><div class="x" onclick="openNalog('${id}')">×</div></div>
    <div class="mbody"><div class="frow"><label>${t("blokLabel")}</label><select id="blokraz">${opts}</select></div><p class="hint">${t("blokModalHint")}</p></div>
    <div class="actions"><button class="primary" onclick="doBlok('${id}')">${t("actBlokiraj")}</button><button class="secondary" onclick="openNalog('${id}')">${t("actOdustani")}</button></div>`);
}
function doBlok(id){ const n=NALOZI.find(x=>x.id===id); n.blok=parseInt(el("blokraz").value)||0; openNalog(id); }
function deblokiraj(id){ const n=NALOZI.find(x=>x.id===id); n.blok=null; openNalog(id); }
function openIsporuka(id){
  const n=NALOZI.find(x=>x.id===id); const cur=n.isporuka||{};
  const tOpts=(MONTAZERI_L[LANG]||MONTAZERI_L.bs).map((tm,i)=>`<option value="${i}"${cur.tim===i?' selected':''}>${tm}</option>`).join("");
  const dateDef=ymdOff(cur.datum!==undefined?cur.datum:(n.rok>=0?n.rok:3));
  const adrVal=cur.adresaKey?(ADRESE[LANG]||ADRESE.bs):(cur.adresa||"");
  openModalHTML(`
    <div class="mhead"><div><h2>${t("isporTitle")}</h2><div style="font-size:13px;opacity:.9;margin-top:4px">${n.id} · ${od(id).naziv}</div></div><div class="x" onclick="openNalog('${id}')">×</div></div>
    <div class="mbody">
      <div class="row2">
        <div class="frow"><label>${t("lDatum")}</label><input id="is_datum" type="date" value="${dateDef}"></div>
        <div class="frow"><label>${t("lTim")}</label><select id="is_tim">${tOpts}</select></div>
      </div>
      <div class="frow"><label>${t("isAdresa")}</label><input id="is_adr" value="${adrVal.replace(/"/g,'&quot;')}" placeholder="${t("isAdrPh")}"></div>
    </div>
    <div class="actions"><button class="primary" onclick="doIsporuka('${id}')">${t("actSacuvaj")}</button><button class="secondary" onclick="openNalog('${id}')">${t("actOdustani")}</button></div>`);
}
function doIsporuka(id){
  const n=NALOZI.find(x=>x.id===id);
  const off=Math.round((new Date(el("is_datum").value)-new Date(dateFromOff(0).setHours(0,0,0,0)))/86400000);
  const prev=(n.isporuka&&n.isporuka.status==="isporuceno")?"isporuceno":"zakazano";
  n.isporuka={datum:isNaN(off)?(n.rok>=0?n.rok:3):off, adresa:(el("is_adr").value||"").trim()||"—", tim:parseInt(el("is_tim").value)||0, status:prev};
  openNalog(id);
}
function markIsporuceno(id){ const n=NALOZI.find(x=>x.id===id); if(n.isporuka) n.isporuka.status="isporuceno"; rerender(); openNalog(id); }

// ---- Nalozi ---------------------------------------------------------------
function renderNalozi(){
  el("view").innerHTML=`
    <div class="viewhead"><h3>${t("naloziTitle")}</h3><span class="sub">${t("naloziSub")}</span></div>
    ${filterBar()}
    <div id="dyn"></div>`;
  fillNalozi();
}
function fillNalozi(){
  const list=filterNalozi(NALOZI).slice().sort((a,b)=>a.rok-b.rok);
  const rows=list.map(n=>{
    const ri=rokInfo(n);
    const badge=isBlok(n)?' <span class="blokbadge">⛔</span>':(fazaBehind(n)?' <span class="behind">⏱</span>':'');
    return `<tr onclick="openNalog('${n.id}')">
      <td><b>${n.id}</b></td>
      <td>${od(n.id).naziv}${badge}<div class="cd muted">${od(n.id).dim}</div></td>
      <td class="muted">${kn(n.k)}</td>
      <td><div class="miniprog">${fazaPill(n)}<span class="mp"><span style="width:${progress(n)}%"></span></span></div></td>
      <td><span class="due ${ri.cls}">${ri.txt}</span></td>
      <td>${prioPill(n.pr)}</td>
      <td class="num">${money(n.vr)}</td></tr>`;
  }).join("")||`<tr><td colspan="7" class="muted" style="padding:20px;text-align:center">${t("emptyFilter")}</td></tr>`;
  el("dyn").innerHTML=`<table class="tbl">
      <thead><tr><th>${t("thNalog")}</th><th>${t("thProizvod")}</th><th>${t("thNarucilac")}</th><th>${t("thFaza")}</th><th>${t("thRok")}</th><th>${t("thPrioritet")}</th><th class="num">${t("thVrijednost")}</th></tr></thead>
      <tbody>${rows}</tbody></table>
    <p class="hint" style="margin-top:10px">${list.length} ${t("rijecNaloga")} (${t("odUkupno")} ${NALOZI.length}).</p>`;
}

// ---- Materijal ------------------------------------------------------------
function renderMaterijal(){
  const aktivni=NALOZI.filter(n=>!isDone(n));
  const demand={};
  aktivni.forEach(n=>(n.bom||[]).forEach(b=>{demand[b.m]=(demand[b.m]||0)+b.kol;}));
  const ispod=Object.values(MATERIJALI).filter(m=>m.zaliha<m.min).length;
  const rows=Object.entries(MATERIJALI).map(([id,m])=>{
    const pot=demand[id]||0;
    const status = m.zaliha<=0?'<span class="pill p-visok">'+t("mNema")+'</span>':(m.zaliha<m.min?'<span class="pill p-srednji">'+t("mNisko")+'</span>':'<span class="pill p-ok">'+t("mOk")+'</span>');
    return `<tr>
      <td><b>${mName(id)}</b></td><td class="muted">${mJed(id)}</td>
      <td class="num${m.zaliha<m.min?' behind':''}">${m.zaliha}</td>
      <td class="num muted">${m.min}</td>
      <td class="num ${pot>m.zaliha?'behind':'muted'}">${pot||'—'}</td>
      <td>${status}</td></tr>`;
  }).join("");
  el("view").innerHTML=`
    <div class="viewhead"><h3>${t("matTitle")}</h3><span class="sub">${ispod} ${t("matSubA")}</span></div>
    <table class="tbl">
      <thead><tr><th>${t("thMaterijal")}</th><th>${t("thJed")}</th><th class="num">${t("thNaStanju")}</th><th class="num">${t("thMin")}</th><th class="num">${t("thPotrebno")}</th><th>${t("thStatus")}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p class="hint">${t("matHint")}</p>`;
}

// ---- Faze -----------------------------------------------------------------
function renderFaze(){
  const aktivni=NALOZI.filter(n=>!isDone(n));
  const perF=FZ().slice(0,LAST).map((f,i)=>({f,i,items:aktivni.filter(n=>n.faza===i)}));
  const maxC=Math.max(...perF.map(x=>x.items.length),1);
  const usko=perF.slice().sort((a,b)=>b.items.length-a.items.length)[0];
  const rows=perF.map(x=>{
    const vr=x.items.reduce((s,n)=>s+n.vr,0);
    const bottleneck = x.items.length===usko.items.length && x.items.length>0;
    return `<div class="bar clk-bar" onclick="openFaza(${x.i})"><span class="blab">${x.f}${bottleneck?' 🔴':''}</span><span class="track"><span class="fill" style="width:${Math.max(3,x.items.length/maxC*100)}%"></span></span><span class="val">${x.items.length} · ${money(vr)}</span></div>`;
  }).join("");
  const behind=aktivni.filter(fazaBehind), blok=aktivni.filter(isBlok);
  const behindPanel = (behind.length||blok.length)?`<div class="panel" style="padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    ${behind.length?`<span><span class="behind">⏱ ${behind.length} ${t("izaPlanaN")}</span> <span class="link" onclick="openIzaPlana()">${t("lista")}</span></span>`:''}
    ${blok.length?`<span><span class="blokbadge">⛔ ${blok.length} ${t("blokN")}</span> <span class="link" onclick="openBlokLista()">${t("lista")}</span></span>`:''}
  </div>`:'';
  el("view").innerHTML=`
    <div class="viewhead"><h3>${t("fazeTitle")}</h3><span class="sub">${t("fazeSub")}</span></div>
    ${behindPanel}
    <div class="panel"><h3>${t("panelUFazi")}</h3>${rows}</div>
    <p class="hint">${t("fazeHint")}</p>`;
}
function listaModal(naslov, arr, extra){
  const rows=arr.length?arr.map(n=>{const ri=rokInfo(n);return `<tr onclick="openNalog('${n.id}')">
      <td><b>${n.id}</b></td><td>${od(n.id).naziv}</td><td class="muted">${kn(n.k)}</td>
      <td>${isDone(n)?FZ()[LAST]:FZ()[n.faza]}</td><td>${extra?extra(n):`<span class="due ${ri.cls}">${ri.txt}</span>`}</td><td class="num">${money(n.vr)}</td></tr>`;}).join("")
    : `<tr><td colspan="6" class="muted" style="padding:16px;text-align:center">${t("nemaNaloga")}</td></tr>`;
  openModalHTML(`
    <div class="mhead"><div><h2>${naslov}</h2><div style="font-size:13px;opacity:.9;margin-top:4px">${arr.length} ${t("rijecNaloga")} · ${t("klikDetalje")}</div></div><div class="x" onclick="closeModal()">×</div></div>
    <div class="mbody"><table class="lines">
      <thead><tr><th>${t("thNalog")}</th><th>${t("thProizvod")}</th><th>${t("thNarucilac")}</th><th>${t("thFaza")}</th><th>${t("thRok")}</th><th class="num">${t("thVrijednost")}</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`);
}
function openFaza(i){ listaModal(FZ()[i], NALOZI.filter(n=>n.faza===i).sort((a,b)=>a.rok-b.rok)); }
function openIzaPlana(){ listaModal(t("titleIzaPlana"), NALOZI.filter(fazaBehind).sort((a,b)=>a.rokFaze[a.faza]-b.rokFaze[b.faza]), n=>`<span class="behind">${fmtDate(n.rokFaze[n.faza])}</span>`); }
function openBlokLista(){ listaModal(t("titleBlok"), NALOZI.filter(isBlok), n=>`<span class="blokbadge">⛔ ${razName(n.blok)}</span>`); }
function openKasni(){ listaModal(t("titleKasni"), NALOZI.filter(isLate).sort((a,b)=>a.rok-b.rok), n=>`<span class="due late">${t("rKasni")} ${-n.rok} ${t("dK")}</span>`); }
function openZaIsporuku(){ listaModal(t("titleZaIsp"), NALOZI.filter(needsDelivery), n=>n.isporuka?`🚚 ${fmtDate(n.isporuka.datum)}`:`<span class="muted">${t("zaIspNije")}</span>`); }

// ---- Pregled --------------------------------------------------------------
function barCount(label,v,max,onclick){ const cls=onclick?'bar clk-bar':'bar', oc=onclick?` onclick="${onclick}"`:''; return `<div class="${cls}"${oc}><span class="blab">${label}</span><span class="track"><span class="fill" style="width:${Math.max(3,v/max*100)}%"></span></span><span class="val">${v}</span></div>`; }
function barMoney(label,v,max,onclick){ const cls=onclick?'bar clk-bar':'bar', oc=onclick?` onclick="${onclick}"`:''; return `<div class="${cls}"${oc}><span class="blab">${label}</span><span class="track"><span class="fill" style="width:${Math.max(3,v/max*100)}%"></span></span><span class="val">${money(v)}</span></div>`; }
function renderPregled(){
  const aktivni=NALOZI.filter(n=>!isDone(n));
  const wip=aktivni.length, vrIzradi=aktivni.reduce((s,n)=>s+n.vr,0);
  const blok=aktivni.filter(isBlok).length, kasni=NALOZI.filter(isLate).length, zaIsporuku=NALOZI.filter(needsDelivery).length;
  const doneN=NALOZI.filter(isDone);
  const naVrijeme=doneN.length?Math.round(doneN.filter(n=>n.rok>=0).length/doneN.length*100):0;
  const perF=FZ().slice(0,LAST).map((f,i)=>({f,i,c:aktivni.filter(n=>n.faza===i).length}));
  const maxF=Math.max(...perF.map(x=>x.c),1);
  const fBars=perF.map(x=>barCount(x.f,x.c,maxF,`openFaza(${x.i})`)).join("");
  const perFv=FZ().slice(0,LAST).map((f,i)=>({f,i,v:aktivni.filter(n=>n.faza===i).reduce((s,n)=>s+n.vr,0)}));
  const maxFv=Math.max(...perFv.map(x=>x.v),1);
  const vBars=perFv.map(x=>barMoney(x.f,x.v,maxFv,`openFaza(${x.i})`)).join("");
  el("view").innerHTML=`
    <div class="kpis">
      <div class="kpi clk" onclick="setView('tabla')"><div class="big">${wip}</div><div class="lab">${t("kpiIzradi")}</div></div>
      <div class="kpi"><div class="big">${money(vrIzradi)}</div><div class="lab">${t("kpiVrijednost")}</div></div>
      <div class="kpi warn clk" onclick="openBlokLista()"><div class="big">${blok}</div><div class="lab">${t("kpiBlok")}</div></div>
      <div class="kpi warn clk" onclick="openKasni()"><div class="big">${kasni}</div><div class="lab">${t("kpiKasni")}</div></div>
      <div class="kpi clk" onclick="openZaIsporuku()"><div class="big">${zaIsporuku}</div><div class="lab">${t("kpiZaIsp")}</div></div>
      <div class="kpi"><div class="big">${naVrijeme}%</div><div class="lab">${t("kpiNaVrijeme")}</div></div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>${t("panelPoFazi")}</h3>${fBars}</div>
      <div class="panel"><h3>${t("panelVrPoFazi")}</h3>${vBars}</div>
    </div>
    <p class="hint">${t("pregledHint")}</p>`;
}

// ---- Novi nalog -----------------------------------------------------------
let nn={k:"K1",pr:"srednji",rok:7};
function openNoviNalog(){
  nn={k:"K1",pr:"srednji",rok:7};
  const kOpts=Object.keys(KDATA.bs).map(k=>`<option value="${k}">${kn(k)}</option>`).join("");
  const prOpts=["visok","srednji","nizak"].map(pr=>`<option value="${pr}"${pr==="srednji"?" selected":""}>${prioName(pr)}</option>`).join("");
  const curLabel=t("nnVr").replace("%c", CURR[t("curr")].suf.trim());
  openModalHTML(`
    <div class="mhead"><div><h2>${t("nnTitle")}</h2><div style="font-size:13px;opacity:.9;margin-top:4px">${t("nnSub")}</div></div><div class="x" onclick="closeModal()">×</div></div>
    <div class="mbody">
      <div class="frow"><label>${t("nnNaziv")}</label><input id="nn_naziv" placeholder="${t("nnNazivPh")}"></div>
      <div class="row2">
        <div class="frow"><label>${t("nnNaruc")}</label><select onchange="nn.k=this.value">${kOpts}</select></div>
        <div class="frow"><label>${t("lPrioritet")}</label><select onchange="nn.pr=this.value">${prOpts}</select></div>
      </div>
      <div class="row2">
        <div class="frow"><label>${t("nnDim")}</label><input id="nn_dim" placeholder="${t("nnDimPh")}"></div>
        <div class="frow"><label>${t("nnMat")}</label><input id="nn_mat" placeholder="${t("nnMatPh")}"></div>
      </div>
      <div class="row2">
        <div class="frow"><label>${curLabel}</label><input id="nn_vr" type="number" min="0" step="50" placeholder="0"></div>
        <div class="frow"><label>${t("nnRok")}</label><input type="date" value="${ymdOff(7)}" onchange="nn.rok=Math.round((new Date(this.value)-new Date(dateFromOff(0).setHours(0,0,0,0)))/86400000)"></div>
      </div>
    </div>
    <div class="actions"><button class="primary" onclick="createNalog()">${t("actOtvori")}</button><span class="hint">${t("nnHint")}</span></div>`);
  setTimeout(()=>el("nn_naziv").focus(),40);
}
function createNalog(){
  const naziv=(el("nn_naziv").value||"").trim();
  if(!naziv){ el("nn_naziv").focus(); return; }
  const dim=(el("nn_dim").value||"").trim()||"—";
  const mat=(el("nn_mat").value||"").trim()||"—";
  const vrLoc=Math.max(0,parseInt(el("nn_vr").value)||0);
  const vr=Math.round(vrLoc/CURR[t("curr")].rate);   // natrag u baznu valutu (KM)
  const nums=NALOZI.map(n=>+n.id.split("-")[1]).filter(x=>!isNaN(x));
  const id="RN-"+(Math.max(0,...nums)+1);
  Object.keys(ODATA).forEach(l=>{ ODATA[l][id]={naziv,dim,mat}; });
  const nrec={id, k:nn.k, vr, faza:0, rok:nn.rok, pr:nn.pr, start:0, prilozi:[], bom:[], blok:null, isporuka:null};
  computeRokFaze(nrec);
  NALOZI.unshift(nrec);
  setView("tabla");
  openNalog(id);
}

applyStatic();
setView("tabla");
</script>
</body>
