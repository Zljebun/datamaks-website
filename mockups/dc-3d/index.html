<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D prikaz skladišta (uživo) · Datamaks</title>
<meta name="description" content="Živi 3D prikaz skladišta i distributivnog centra: regali sa stanjem zaliha, prijem i izdavanje, viljuškari, dokovi i kamioni. Klikabilno, izmišljeni podaci, stvarna logika. Datamaks.">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://datamaks.net/mockups/dc-3d/">
<link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(180deg,#eef5ff,#cbdaee);
    font-family:Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#0f172a;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #app{position:fixed;inset:0}
  .hero3d-canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
  /* HUD (svijetle plocice) */
  .hero3d-hud{position:absolute;inset:0;pointer-events:none;z-index:3;color:#0f172a}
  .pnl{background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(246,250,255,.9));
    border:1px solid rgba(255,255,255,.75);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 2px 6px rgba(20,40,80,.07),0 12px 30px rgba(18,42,88,.16);
    backdrop-filter:blur(10px) saturate(1.2)}
  #brand{position:absolute;top:14px;left:14px;padding:12px 16px;border-radius:16px;z-index:4}
  #brand .t{font-weight:800;font-size:16px;letter-spacing:.2px}
  #brand .t b{color:#d81f26}
  #brand .s{font-size:12px;opacity:.72;margin-top:3px}
  #brand .demo{display:inline-block;margin-top:9px;font-size:10px;font-weight:700;letter-spacing:.08em;color:#fff;
    background:linear-gradient(145deg,#2563eb,#1e3a8a);padding:3px 9px;border-radius:999px}
  .hero3d-badge{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;
    font-size:11px;font-weight:800;letter-spacing:.1em;
    background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(246,250,255,.9));
    border:1px solid rgba(40,70,120,.14);padding:6px 12px;border-radius:999px;box-shadow:0 6px 18px rgba(18,42,88,.12)}
  .hero3d-dot{width:8px;height:8px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 0 rgba(22,163,74,.55);animation:h3pulse 1.8s infinite}
  @keyframes h3pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 8px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
  .hero3d-kpis{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:7px;width:150px}
  .hero3d-kpi{background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(246,250,255,.9));
    border:1px solid rgba(40,70,120,.12);border-radius:12px;padding:9px 13px;text-align:right;box-shadow:0 6px 16px rgba(18,42,88,.1)}
  .hero3d-kpi b{display:block;font-size:22px;font-weight:800;line-height:1;color:#0f172a}
  .hero3d-kpi span{font-size:10.5px;opacity:.62}
  .hero3d-kpi-warn b{color:#b45309}
  .hero3d-ticker{position:absolute;left:14px;bottom:14px;width:420px;max-width:calc(100vw - 28px);
    background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(246,250,255,.9));
    border:1px solid rgba(40,70,120,.12);border-radius:12px;padding:10px 13px;font-size:13px;color:#1e293b;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;box-shadow:0 6px 16px rgba(18,42,88,.1)}
  .hero3d-full{display:none}  /* vec smo fullscreen */
  #hint{position:absolute;right:14px;bottom:14px;padding:8px 13px;border-radius:12px;font-size:12px;color:#475569;z-index:4}
  .hero3d-card{position:absolute;z-index:5;display:none;min-width:180px;max-width:230px;padding:12px 14px;
    background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(246,250,255,.95));
    border:1px solid rgba(40,70,120,.16);border-radius:14px;box-shadow:0 14px 36px rgba(18,42,88,.24);
    color:#0f172a;pointer-events:none}
  .hero3d-card .h{font-weight:800;font-size:13.5px;margin-bottom:7px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .hero3d-card .row{font-size:12.5px;display:flex;justify-content:space-between;gap:12px;padding:2px 0}
  .hero3d-card .row b{font-weight:600;opacity:.6}
  .hero3d-card .tag{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:999px}
  .hero3d-card .tag.ok{background:rgba(22,163,74,.15);color:#15803d}
  .hero3d-card .tag.warn{background:rgba(245,158,11,.18);color:#b45309}
  .hero3d-card .tag.move{background:rgba(37,99,235,.15);color:#1d4ed8}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:10;
    background:linear-gradient(180deg,#eef5ff,#cbdaee);color:#334155}
  #loading .sp{width:34px;height:34px;border:3px solid rgba(40,70,120,.2);border-top-color:#2563eb;border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:720px){
    .hero3d-kpis{width:120px}
    .hero3d-ticker{width:300px}
    #hint{display:none}
    #brand{padding:10px 13px}
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="brand" class="pnl hud">
  <div class="t"><b>Datamaks</b> · 3D skladište</div>
  <div class="s">Pregled operacija uživo</div>
  <span class="demo">3D DEMO · izmišljeni podaci</span>
</div>
<div id="hint" class="pnl hud">Rotiraj mišem · točkić za zum · klikni na regal, viljuškar ili kamion</div>

<div id="loading"><div class="sp"></div><div>Učitavanje 3D scene...</div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
  function webglOK(){ try{ const c=document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl')||c.getContext('experimental-webgl'))); }catch(e){ return false; } }
  const app = document.getElementById('app');
  if(!webglOK()){
    document.getElementById('loading').innerHTML = '<div style="max-width:320px;text-align:center">Vaš pregledač ne podržava 3D prikaz (WebGL). Otvorite na računaru u Chrome ili Safari.</div>';
  } else {
    import('/assets/js/hero-3d.js?v=3').then(function(m){
      m.initHero3D(app);
      const l=document.getElementById('loading'); if(l) setTimeout(()=>{ l.style.display='none'; }, 400);
    }).catch(function(err){
      document.getElementById('loading').innerHTML = '<div style="max-width:320px;text-align:center">Greška pri učitavanju 3D scene. Pokušajte osvježiti stranicu.</div>';
    });
  }
</script>
</body>
</html>
