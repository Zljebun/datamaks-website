<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://datamaks.net/mockups/dasprom/">
<title>DAS-PROM ERP za staklaru (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#0f6e8c; --teal-2:#128ca8; --teal-3:#0b5468;
  --aqua:#19b6c9; --aqua-2:#2fc6d6; --aqua-soft:#e4f6f9;
  --bg:#f3f6f8; --card:#ffffff; --text:#162430; --muted:#657586;
  --border:#e5ebf0; --border-2:#eef2f5;
  --green:#15a34a; --green-soft:#e6f6ec;
  --amber:#d9880a; --amber-soft:#fdf2e0;
  --red:#d92c2c; --red-soft:#fdeaea;
  --glass:rgba(25,182,201,.10);
  --violet:#6b46c1; --violet-soft:#efeafd;
  --shadow:0 1px 2px rgba(16,46,66,.04), 0 4px 16px rgba(16,46,66,.06);
  --shadow-lg:0 8px 30px rgba(16,46,66,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{overflow-x:hidden;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.app{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{width:244px;background:linear-gradient(180deg,var(--teal) 0%,var(--teal-3) 100%);color:#dcecf0;display:flex;flex-direction:column;position:fixed;height:100vh;z-index:20;transition:transform .25s ease}
.sb-logo{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:11px}
.sb-logo .mark{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid rgba(255,255,255,.22)}
.sb-logo .mark svg{width:23px;height:23px;color:#fff}
.sb-logo .txt b{display:block;font-size:17px;font-weight:800;color:#fff;letter-spacing:.5px}
.sb-logo .txt span{font-size:9.5px;color:var(--aqua-2);letter-spacing:1.6px;font-weight:600}
.sb-nav{padding:12px 11px;flex:1;overflow-y:auto}
.sb-nav .lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#8fb6c2;padding:14px 12px 6px;font-weight:700}
.nav-item{text-decoration:none;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:#c3dbe2;font-weight:500;margin-bottom:2px;transition:.15s;width:100%;text-align:left;font-size:13.5px}
.nav-item svg{width:19px;height:19px;flex-shrink:0;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:linear-gradient(90deg,var(--aqua) 0%,var(--teal-2) 130%);color:#fff;box-shadow:0 4px 14px rgba(25,182,201,.35)}
.nav-item.active svg{opacity:1}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px}
.nav-item.active .badge{background:rgba(255,255,255,.28)}
.sb-user{padding:13px 15px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:11px}
.sb-user .av{width:34px;height:34px;border-radius:50%;background:var(--aqua);color:#073;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff}
.sb-user .info b{display:block;font-size:12.5px;color:#fff}
.sb-user .info span{font-size:11px;color:#9cc0cc}

/* MAIN */
.main{flex:1;margin-left:244px;display:flex;flex-direction:column;min-width:0}
.topbar{min-height:64px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 26px;position:sticky;top:0;z-index:10}
.topbar h1{font-size:18px;font-weight:700}
.topbar .sub{font-size:12.5px;color:var(--muted);font-weight:400;margin-top:1px}
.search{margin-left:auto;position:relative}
.search input{width:250px;border:1px solid var(--border);background:var(--bg);border-radius:9px;padding:9px 12px 9px 36px;font-size:13px;outline:none;transition:.15s}
.search input:focus{border-color:var(--aqua);background:#fff;box-shadow:0 0 0 3px var(--aqua-soft)}
.search svg{position:absolute;left:11px;top:9px;width:17px;height:17px;color:var(--muted)}
.topdate{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.content{padding:24px 26px;max-width:1340px;width:100%}
.hamburger{display:none;width:40px;height:40px;border-radius:9px;align-items:center;justify-content:center;color:var(--teal);background:var(--bg);flex-shrink:0}
.hamburger svg{width:22px;height:22px}
.sb-backdrop{display:none;position:fixed;inset:0;background:rgba(13,42,58,.5);z-index:15}
.sb-backdrop.show{display:block}

/* GENERIC */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.blue{background:var(--aqua-soft);color:var(--teal)}
.pill.gray{background:#eef1f4;color:var(--muted)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.section-title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:24px 0 12px;display:flex;align-items:center;gap:10px}
.section-title:first-child{margin-top:0}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--teal-2);color:#fff;font-weight:600;font-size:13px;padding:9px 15px;border-radius:9px;transition:.15s}
.btn:hover{background:var(--teal);box-shadow:0 4px 14px rgba(15,110,140,.3)}
.btn svg{width:16px;height:16px}
.btn.aqua{background:var(--aqua)}.btn.aqua:hover{background:var(--aqua-2)}
.btn.ghost{background:#fff;color:var(--teal-2);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--bg);box-shadow:none}
.btn.sm{padding:6px 11px;font-size:12px}
.filt{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.filt button{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--muted);transition:.15s}
.filt button:hover{background:var(--bg)}
.filt button.on{background:var(--teal-2);border-color:var(--teal-2);color:#fff}
.filt button .c{opacity:.7;margin-left:4px}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.crumb button:hover{color:var(--aqua)}
.progress{height:8px;background:#eef1f4;border-radius:20px;overflow:hidden}
.progress .bar{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--aqua),var(--teal-2));transition:width .4s}
.progress .bar.full{background:linear-gradient(90deg,#22c55e,#15a34a)}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{display:block;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:.15s;cursor:pointer;text-align:left;width:100%}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kpi .ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.kpi .ico svg{width:20px;height:20px}
.kpi .num{font-size:27px;font-weight:800;line-height:1}
.kpi .lab{font-size:12.5px;color:var(--muted);margin-top:5px;font-weight:500}
.kpi.alert{border-color:#f6c9c9}.kpi.alert .num{color:var(--red)}
.kpi.warn{border-color:#f5dfb3}.kpi.warn .num{color:var(--amber)}
.ico.blue{background:var(--aqua-soft);color:var(--teal)}
.ico.red{background:var(--red-soft);color:var(--red)}
.ico.amber{background:var(--amber-soft);color:var(--amber)}
.ico.green{background:var(--green-soft);color:var(--green)}
.ico.teal{background:#e3eff2;color:var(--teal)}

/* PIPELINE */
.pipeline{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
.stage{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 11px;box-shadow:var(--shadow);text-align:center;position:relative}
.stage{cursor:pointer;transition:.12s}.stage:hover{border-color:var(--aqua);transform:translateY(-1px)}
.st-filt{display:inline-flex;align-items:center;gap:8px;background:var(--aqua-soft);color:var(--teal-2);border-radius:20px;padding:6px 8px 6px 12px;font-size:12.5px;margin:-4px 0 14px}
.st-filt button{width:22px;height:22px;border-radius:50%;color:var(--teal-2);font-size:12px}.st-filt button:hover{background:rgba(0,0,0,.06)}
.stage .st-top{width:34px;height:34px;border-radius:9px;background:var(--aqua-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.stage .st-top svg{width:17px;height:17px}
.stage .st-num{font-size:21px;font-weight:800}
.stage .st-name{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.stage .st-bar{height:4px;border-radius:20px;background:#eef1f4;margin-top:8px;overflow:hidden}
.stage .st-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--aqua),var(--teal-2))}

.two-col{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border-2)}
.panel-h b{font-size:14px}
.panel-h .lnk{font-size:12.5px;color:var(--teal-2);font-weight:600}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border-2);cursor:pointer;transition:.12s}
.list-row:last-child{border-bottom:none}
.list-row:hover{background:#f8fafb}
.list-row .r-main{flex:1;min-width:0}
.list-row .r-main b{font-size:13.5px;font-weight:600}
.list-row .r-main span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.list-row .r-act{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0}
.list-row.izl .vr{width:44px;font-size:13px;flex-shrink:0;font-weight:700}

/* TABLE */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--border);background:#fafbfc;white-space:nowrap}
table.tbl td{padding:12px 16px;border-bottom:1px solid var(--border-2);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr.clickable{cursor:pointer;transition:.12s}
table.tbl tbody tr.clickable:hover{background:var(--aqua-soft)}
.mono{font-variant-numeric:tabular-nums;font-weight:600}
.avatar-sm{width:30px;height:30px;border-radius:8px;background:var(--teal-2);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}

/* NALOG DETAIL */
.detail-head{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap}
.detail-head .dh-main{flex:1;min-width:260px}
.dh-stat{text-align:right}.dh-pct{font-size:30px;font-weight:800;margin-top:8px}.dh-pl{font-size:11.5px;color:var(--muted)}
.detail-head h2{font-size:23px;font-weight:800}
.detail-head .meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px}
.detail-head .meta .m b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
.detail-head .meta .m span{font-size:14px;font-weight:600}

.phase-track{display:flex;align-items:flex-start;gap:0;margin:6px 0 4px;overflow-x:auto}
.ph{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:64px;position:relative;padding-top:4px}
.ph::before{content:"";position:absolute;top:17px;left:-50%;width:100%;height:2px;background:#e1e7ec;z-index:1}
.ph:first-child::before{display:none}
.ph.done::before,.ph.active::before{background:var(--aqua)}
.ph .dot{width:28px;height:28px;border-radius:50%;background:#eef1f4;border:2px solid #dde3ea;display:flex;align-items:center;justify-content:center;z-index:2;color:var(--muted)}
.ph .dot svg{width:14px;height:14px}
.ph.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.ph.active .dot{background:var(--aqua);border-color:var(--aqua);color:#fff;box-shadow:0 0 0 4px var(--aqua-soft)}
.ph .pl{font-size:10.5px;color:var(--muted);text-align:center;font-weight:500;line-height:1.3}
.ph.done .pl,.ph.active .pl{color:var(--text);font-weight:600}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border-2);font-size:13px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--muted)}
.kv b{font-weight:600}
.timeline{list-style:none}
.timeline li{position:relative;padding:0 0 15px 22px;font-size:13px}
.timeline li::before{content:"";position:absolute;left:4px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--aqua)}
.timeline li::after{content:"";position:absolute;left:8px;top:13px;bottom:0;width:1px;background:var(--border)}
.timeline li:last-child::after{display:none}
.timeline li b{font-weight:600}
.timeline li span{display:block;color:var(--muted);font-size:11.5px}

/* KANBAN */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{min-width:200px;flex:1;background:#eef2f5;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:9px}
.kcol-h{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 2px;font-size:12px;font-weight:700;color:var(--teal-3)}
.kcol-h .cnt{background:#fff;border-radius:20px;padding:1px 8px;font-size:11px;color:var(--muted)}
.kcard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 12px;box-shadow:0 1px 2px rgba(16,46,66,.05);cursor:pointer;transition:.12s}
.kcard:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.kcard b{font-size:12.5px;font-weight:700}
.kcard .kc-sub{font-size:11.5px;color:var(--muted);margin:3px 0 7px}
.kcard .kc-foot{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}

/* MODAL / TOAST */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(13,42,58,.45);z-index:40;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;box-shadow:var(--shadow-lg);max-height:90vh;overflow:auto}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--border-2);display:flex;align-items:center;justify-content:space-between}
.modal-h b{font-size:16px}
.modal-h .x{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.modal-h .x:hover{background:var(--bg)}
.modal-b{padding:20px 22px}
.modal-f{padding:16px 22px;border-top:1px solid var(--border-2);display:flex;gap:10px;justify-content:flex-end}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--aqua);box-shadow:0 0 0 3px var(--aqua-soft)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--text);color:#fff;padding:13px 20px;border-radius:11px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);z-index:60;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);display:flex;align-items:center;gap:9px;max-width:92vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast svg{width:18px;height:18px;color:var(--aqua-2)}

.mini-note{font-size:11.5px;color:var(--muted);background:var(--aqua-soft);border:1px solid #cdeaf0;border-radius:10px;padding:10px 13px;display:flex;gap:9px;align-items:flex-start}
.mini-note svg{width:16px;height:16px;color:var(--teal);flex-shrink:0;margin-top:1px}

.screen{display:none}
.screen.active{display:block}

/* PRODAJA */
.pill.violet{background:var(--violet-soft);color:var(--violet)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tabs button{padding:10px 14px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--teal-2);border-color:var(--teal-2)}
.ed{width:100%;border:1px solid var(--border);border-radius:7px;padding:6px 8px;font:inherit;font-size:12.5px;background:var(--card);color:var(--text);outline:none}
.ed:focus{border-color:var(--aqua);box-shadow:0 0 0 3px var(--aqua-soft)}
.ed:disabled{background:transparent;border-color:transparent;color:var(--text);appearance:none;-webkit-appearance:none;opacity:1}
.ed.num{width:76px;text-align:right}
.tg{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;border:1px solid var(--border);color:var(--muted);background:var(--card)}
.tg.on{background:var(--aqua-soft);border-color:#9fdbe5;color:var(--teal)}
.tg:disabled{cursor:default}
table.ped td{padding:8px 8px;vertical-align:middle}
table.ped th{padding:10px 8px}
table.ped tr.prow td{border-bottom:none;padding-bottom:4px}
.brk{font-size:11px;color:var(--muted);padding-top:0!important}
.brk b{font-weight:600;color:var(--text)}
.x-del{width:26px;height:26px;border-radius:7px;color:var(--muted)}
.x-del:hover{background:var(--red-soft);color:var(--red)}
.tot .kv span{display:flex;align-items:center}
.tot .kv.big{font-size:15px;border-top:2px solid var(--border);margin-top:4px;padding-top:12px}
.tot .kv.big b{font-size:19px;color:var(--teal-2)}
.bars .b{display:flex;align-items:center;gap:10px;font-size:12.5px;margin-bottom:10px}
.bars .tr{flex:1;height:8px;background:var(--border-2);border-radius:9px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--aqua),var(--teal-2))}
.modal.wide{max-width:880px}
.doc{background:#fff;color:#162430;padding:30px 34px;font-size:12px;border:1px solid #e5ebf0;border-radius:6px;box-shadow:0 2px 10px rgba(16,46,66,.08)}
.doc-h{display:flex;justify-content:space-between;gap:20px;padding-bottom:16px;border-bottom:2px solid #0f6e8c;color:#4a5a68}
.doc-logo{font-size:22px;font-weight:800;color:#0f6e8c;letter-spacing:.5px}
.doc-t{font-size:15px;font-weight:800;color:#162430;margin-bottom:4px}
.doc-k{margin:16px 0;padding:12px 14px;background:#f3f6f8;border-radius:6px}
.doc-tb{width:100%;border-collapse:collapse}
.doc-tb th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#657586;border-bottom:1px solid #d5dde3;padding:7px 6px}
.doc-tb td{padding:7px 6px;border-bottom:1px solid #eef2f5;vertical-align:top}
.doc-tb td span{color:#657586;font-size:11px}
.doc-tb th:last-child,.doc-tb td:last-child{text-align:right}
.doc-sum{margin:14px 0 0 auto;width:260px;max-width:100%}
.doc-sum div{display:flex;justify-content:space-between;padding:4px 0}
.doc-sum .g{border-top:2px solid #162430;margin-top:4px;padding-top:8px;font-size:14px}
.doc-u{margin-top:18px;font-size:11.5px;color:#4a5a68;line-height:1.6}
.doc-f{display:flex;justify-content:space-between;gap:12px;margin-top:22px;padding-top:10px;border-top:1px solid #eef2f5;font-size:10.5px;color:#8696a3}

const DANAS='21.10.', TODAY=new Date(2026,9,21);
function pd(s){const [d,m]=s.split('.');return new Date(2026,+m-1,+d);}
function fd(x){return String(x.getDate()).padStart(2,'0')+'.'+String(x.getMonth()+1).padStart(2,'0')+'.';}
function addD(s,n){const x=pd(s);x.setDate(x.getDate()+n);return fd(x);}
function dana(s){return Math.round((TODAY-pd(s))/864e5);}
function dn(n){return n===1?'dan':'dana';}
const fmt=n=>n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>Math.round(n).toLocaleString('de-DE');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const uslItem=k=>CJ.usluge.find(u=>u.k===k);
const zadnja=u=>u.verzije[u.verzije.length-1];
const ponBr=u=>u.id.replace('UP','PON');
const RUTA_RED=['rez','brus','pjesk','far','kal','lam','izo'];

// kalkulacija jedne pozicije: staklo po m² (min površina po komadu) + obrade po m², dužnom metru ili komadu
function calcSt(x){
  const st=CJ.stakla[x.st];
  const m2=Math.max(x.s*x.v/1e6,MIN_M2)*x.kom;
  const obim=2*(x.s+x.v)/1000*x.kom;
  const parts=[{n:st.n,q:m2,j:'m²',c:st.c}];
  Object.keys(CJ.obrade).forEach(k=>{if(!x.o[k])return;const o=CJ.obrade[k];
    parts.push({n:o.n,q:k==='rupe'?x.o.rupe*x.kom:(o.j==='m'?obim:m2),j:o.j,c:o.c});});
  parts.forEach(p=>p.iz=p.q*p.c);
  return {m2,parts,sum:parts.reduce((a,p)=>a+p.iz,0)};
}
function calcV(v){
  const st=v.stavke.reduce((a,x)=>a+calcSt(x).sum,0);
  const us=v.usl.reduce((a,u)=>a+uslItem(u.k).c*u.kol,0);
  const mz=st+us, rab=mz*(v.rabat||0)/100, osn=mz-rab, pdv=osn*.17;
  return {st,us,mz,rab,osn,pdv,uk:osn+pdv,m2:v.stavke.reduce((a,x)=>a+calcSt(x).m2,0)};
}
const vrijU=u=>{const v=zadnja(u);return v?calcV(v).osn:null;};
// ruta kroz staklaru izvedena iz obrada na pozicijama (rezanje uvijek)
function rutaIz(v){
  const s=new Set(['rez']);
  v.stavke.forEach(x=>{Object.keys(x.o).forEach(k=>{if(x.o[k])s.add(CJ.obrade[k].st);});if(CJ.stakla[x.st].izo)s.add('izo');});
  return RUTA_RED.filter(k=>s.has(k)).concat(['komplet','isporuka']);
}

        <td style="max-width:280px">${u.naslov}<br><span style="color:var(--muted);font-size:12px">${u.tip}</span></td>

/* ---------- UPIT / PONUDA DETALJ ---------- */
let VSEL=null; // indeks verzije koja se gleda
function openUpit(id,keepV){
  const u=UPITI.find(x=>x.id===id);if(!u)return;
  if(!keepV)VSEL=u.verzije.length-1;
  CUR='upit';
  document.getElementById('pgTitle').textContent=u.id+' · '+u.kupac;
  document.getElementById('pgSub').textContent=u.naslov;
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.k==='prodaja'));
  const korak={nov:0,mjerenje:1,izrada:2,poslata:3,odbijeno:3,prihvaceno:6}[u.status];
  const koraci=['Upit','Mjerenje','Ponuda','Poslata kupcu','Prihvaćeno','Radni nalog'];
  const vr=vrijU(u);
  document.getElementById('content').innerHTML=`
  <div class="crumb"><button onclick="go('prodaja')">Prodaja</button> ${ic('arrow',13)} <b style="color:var(--text)">${u.id}</b></div>
  <div class="card" style="padding:22px">
    <div class="detail-head">
      <div class="dh-main">
        <h2>${u.naslov}</h2>
        <div class="meta">
          <div class="m"><b>Kupac</b><span>${kLink(u.kupac)}</span></div>
          <div class="m"><b>Kontakt</b><span>${u.kontakt} · ${u.tel}</span></div>
          <div class="m"><b>Email</b><span>${u.email}</span></div>
          <div class="m"><b>Izvor</b><span>${u.izvor}</span></div>
          <div class="m"><b>Komercijalista</b><span>${u.kom}</span></div>
          <div class="m"><b>Primljeno</b><span>${u.datum}</span></div>
        </div>
      </div>
      <div style="text-align:right">${statusPill(u.status)}<div style="font-size:26px;font-weight:800;margin-top:8px">${vr?fmt0(vr)+' KM':'—'}</div><div style="font-size:11.5px;color:var(--muted)">${vr?'bez PDV · v'+zadnja(u).v:'ponuda nije napravljena'}</div></div>
    </div>
    <p style="margin-top:14px;color:var(--muted);font-size:13px;max-width:760px">${u.opis}</p>
    <div style="margin-top:18px"><div class="phase-track">
      ${koraci.map((k,i)=>{const done=i<korak||(i===1&&korak>1),act=i===korak&&u.status!=='odbijeno';
        return `<div class="ph ${done?'done':act?'active':''}"><div class="dot">${done?ic('check',14):i+1}</div><div class="pl">${k}</div></div>`}).join('')}
    </div></div>
    <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">${akcije(u)}</div>
  </div>

  <div id="editor" style="margin-top:16px">${u.verzije.length?editorHTML(u):`<div class="card" style="padding:26px;text-align:center;color:var(--muted)">
    <div style="font-weight:600;color:var(--text);margin-bottom:4px">Ponuda još nije napravljena</div>
    ${u.status==='mjerenje'?'Ponuda se pravi nakon mjerenja na terenu, sa tačnim mjerama.':'Napravi ponudu direktno ili prvo zakaži mjerenje na terenu.'}</div>`}</div>

  <div class="grid-2" style="margin-top:16px">
    <div class="card" style="padding:18px">
      <div class="panel-h" style="padding:0 0 14px"><b>Aktivnosti</b><span style="font-size:11.5px;color:var(--muted)">pozivi, mailovi, mjerenja, verzije</span></div>
      <ul class="timeline">${u.akt.slice().reverse().map(a=>`<li><b>${a.t}</b><span>${a.d} · ${a.ko}</span></li>`).join('')}</ul>
      <div style="display:flex;gap:8px;margin-top:6px"><input id="bilj" class="ed" placeholder="Dodaj bilješku, npr. kupac zove ponovo u petak" onkeydown="if(event.key==='Enter')biljeska('${u.id}')"><button class="btn sm" onclick="biljeska('${u.id}')">Dodaj</button></div>
    </div>
    <div class="card" style="padding:18px">
      <div class="panel-h" style="padding:0 0 10px"><b>Detalji</b></div>
      <div class="kv"><span>Vrsta posla</span><b>${u.tip}</b></div>
      <div class="kv"><span>Lokacija</span><b>${u.grad}</b></div>
      <div class="kv"><span>Mjerenje na terenu</span><b>${u.mjer?`${u.mjer.datum} ${u.mjer.vrijeme} · ${u.mjer.ekipa} ${u.mjer.done?'<span class="pill green">urađeno</span>':'<span class="pill violet">zakazano</span>'}`:'—'}</b></div>
      ${u.status==='prihvaceno'?`<div class="kv"><span>Radni nalog</span><b><button class="lnk" style="color:var(--teal-2);font-weight:700" onclick="openNalog('${u.nalog}')">${u.nalog} →</button></b></div>`:''}
      ${u.status==='odbijeno'?`<div class="kv"><span>Razlog odbijanja</span><b>${u.razlog}</b></div>`:''}
      <div style="font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 8px">Dokumenti</div>
      ${(u.dok.length?u.dok:[]).map(d=>`<div class="list-row" style="padding:8px 0" onclick="toast('Otvaranje priloga u punoj verziji')">${ic('file',16)}<div class="r-main"><b style="font-size:12.5px">${d}</b></div></div>`).join('')||'<div style="font-size:12px;color:var(--muted)">Nema priloga.</div>'}

    </div>
  </div>`;
  window.scrollTo(0,0);toggleSb(false);
}

function akcije(u){
  const b=(cls,on,txt,icn)=>`<button class="btn ${cls}" onclick="${on}">${icn?ic(icn,16):''} ${txt}</button>`;
  const v=zadnja(u), id=u.id, out=[];
  if(u.status==='nov'){out.push(b('',`openModal(modalMjerenje('${id}'))`,'Zakaži mjerenje','ruler'),b('ghost',`napraviPonudu('${id}')`,'Napravi ponudu bez mjerenja','file'));}
  if(u.status==='mjerenje'){out.push(b('',`napraviPonudu('${id}')`,'Mjerenje urađeno, napravi ponudu','check'),b('ghost',`openModal(modalMjerenje('${id}'))`,'Pomjeri termin','clock'));}
  if(u.status==='izrada')out.push(b('',`openModal(modalPosalji('${id}'),1)`,`Pošalji ponudu v${v.v} kupcu`,'mail'));
  if(u.status==='poslata'){out.push(b('',`openModal(modalPrihvati('${id}'))`,'Kupac prihvatio → radni nalog','check'),b('ghost',`novaVerzija('${id}')`,'Kupac traži izmjenu → nova verzija','edit'),b('ghost',`openModal(modalOdbij('${id}'))`,'Odbijeno','alert'));}
  if(u.status==='prihvaceno')out.push(b('',`openNalog('${u.nalog}')`,`Otvori radni nalog ${u.nalog}`,'nalozi'));
  if(v)out.push(b('ghost',`openModal(modalDok('${id}'),1)`,'Pregled dokumenta','file'));
  out.push(b('ghost',`toast('Poziv se bilježi u aktivnosti (u punoj verziji i click-to-call)')`,'Pozovi '+u.tel,'phone'));
  return out.join('');
}

/* ---------- EDITOR PONUDE ---------- */

function edV(){const u=edU();return u.verzije[VSEL];}

  setTimeout(()=>{const e=document.getElementById('editor');if(e){e.dataset.u=u.id;v.stavke.forEach((_,i)=>updRow(i));updTot();}},0);
  return `<div class="card">
    <div class="panel-h" style="flex-wrap:wrap;gap:10px">
      <div><b>Ponuda ${ponBr(u)}/${v.v}</b><span style="font-size:12px;color:var(--muted);margin-left:8px">napravljena ${v.datum}${v.poslata?' · poslata '+v.poslata+' · važi do '+v.vazi:' · nije poslata'}</span></div>
      <div class="filt" style="margin:0">${u.verzije.map((x,i)=>`<button class="${i===VSEL?'on':''}" onclick="VSEL=${i};openUpit('${u.id}',1)">v${x.v}</button>`).join('')}</div>
    </div>

    <div class="tbl-wrap"><table class="tbl ped" style="min-width:1020px">
      <thead><tr><th>#</th><th>Pozicija</th><th>Staklo</th><th>Š mm</th><th>V mm</th><th>Kom</th><th>Obrade</th><th>m²</th><th style="text-align:right">Iznos KM</th><th></th></tr></thead>
      <tbody>${v.stavke.map((x,i)=>`<tr class="prow">
        <td class="mono">${i+1}</td>
        <td><input class="ed" style="min-width:160px" value="${esc(x.opis)}" oninput="edV().stavke[${i}].opis=this.value" ${dis}></td>
        <td><select class="ed" onchange="edF(${i},'st',this.value)" ${dis}>${Object.entries(CJ.stakla).map(([k,s])=>`<option value="${k}" ${k===x.st?'selected':''}>${s.n}</option>`).join('')}</select></td>
        <td><input class="ed num" type="number" min="0" value="${x.s}" oninput="edF(${i},'s',this.value)" ${dis}></td>
        <td><input class="ed num" type="number" min="0" value="${x.v}" oninput="edF(${i},'v',this.value)" ${dis}></td>
        <td><input class="ed num" style="width:56px" type="number" min="1" value="${x.kom}" oninput="edF(${i},'kom',this.value)" ${dis}></td>
        <td><div style="display:flex;gap:4px;flex-wrap:wrap;width:250px">${['brus','faz','pjesk','far','kal','lam'].map(k=>`<button class="tg ${x.o[k]?'on':''}" onclick="edO(${i},'${k}')" ${dis}>${CJ.obrade[k].kr}</button>`).join('')}
          <span class="tg ${x.o.rupe?'on':''}" style="display:inline-flex;align-items:center;gap:4px">Rupe/kom <input class="ed" style="width:40px;padding:1px 4px" type="number" min="0" value="${x.o.rupe||0}" oninput="edF(${i},'rupe',this.value)" ${dis}></span></div></td>
        <td class="mono" id="m2-${i}"></td>
        <td class="mono" id="iz-${i}" style="text-align:right"></td>
        <td>${lock?'':`<button class="x-del" title="Ukloni" onclick="edV().stavke.splice(${i},1);rerenderEd()">✕</button>`}</td></tr>
        <tr class="brk-row"><td></td><td colspan="9" class="brk" id="brk-${i}"></td></tr>`).join('')}</tbody>
    </table></div>
    ${lock?'':`<div style="padding:10px 18px"><button class="btn ghost sm" onclick="dodajStavku()">${ic('plus',14)} Dodaj poziciju</button></div>`}

    <div class="panel-h" style="border-top:1px solid var(--border-2)"><b>Okov i usluge</b></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Artikal / usluga</th><th>Količina</th><th>Jed.</th><th style="text-align:right">Cijena</th><th style="text-align:right">Iznos KM</th><th></th></tr></thead>
      <tbody>${v.usl.map((x,i)=>{const it=uslItem(x.k);return `<tr><td><b>${it.n}</b></td>
        <td><input class="ed num" type="number" min="0" value="${x.kol}" oninput="edV().usl[${i}].kol=Math.max(0,+this.value||0);updTot()" ${dis}></td>
        <td>${it.j}</td><td class="mono" style="text-align:right">${fmt(it.c)}</td><td class="mono" id="ui-${i}" style="text-align:right"></td>
        <td>${lock?'':`<button class="x-del" onclick="edV().usl.splice(${i},1);rerenderEd()">✕</button>`}</td></tr>`}).join('')}</tbody></table></div>
    ${lock?'':`<div style="padding:10px 18px;display:flex;gap:8px;flex-wrap:wrap"><select class="ed" id="uslAdd" style="width:auto">${CJ.usluge.map(x=>`<option value="${x.k}">${x.n} (${fmt(x.c)} KM/${x.j})</option>`).join('')}</select><button class="btn ghost sm" onclick="edV().usl.push({k:document.getElementById('uslAdd').value,kol:1});rerenderEd()">${ic('plus',14)} Dodaj</button></div>`}

    <div class="grid-2" style="padding:18px;border-top:1px solid var(--border-2)">
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px">Ruta u proizvodnji (izvodi se iz obrada)</div>

        <div class="grid-2" style="gap:10px;margin-top:16px">
          <div class="fld" style="margin:0"><label>Avans</label><select class="ed" onchange="edV().avans=+this.value" ${dis}>${[0,30,40,50,100].map(p=>`<option value="${p}" ${p===v.avans?'selected':''}>${p?p+'% po prihvatanju':'bez avansa'}</option>`).join('')}</select></div>
          <div class="fld" style="margin:0"><label>Rok izrade</label><input class="ed" value="${esc(v.rok)}" oninput="edV().rok=this.value" ${dis}></div>
        </div>
        <div class="fld" style="margin:10px 0 0"><label>Napomena na ponudi</label><textarea class="ed" rows="2" oninput="edV().nap=this.value" ${dis}>${esc(v.nap||'')}</textarea></div>
      </div>
      <div class="tot">
        <div class="kv"><span>Staklo i obrada (<span id="t-m2"></span> m²)</span><b class="mono" id="t-st"></b></div>
        <div class="kv"><span>Okov i usluge</span><b class="mono" id="t-us"></b></div>
        <div class="kv"><span>Rabat <input class="ed num" style="width:56px;padding:2px 6px;margin-left:6px" type="number" min="0" max="50" value="${v.rabat||0}" oninput="edV().rabat=Math.min(50,Math.max(0,+this.value||0));updTot()" ${dis}> %</span><b class="mono" id="t-rab"></b></div>
        <div class="kv"><span>Osnovica</span><b class="mono" id="t-osn"></b></div>
        <div class="kv"><span>PDV 17%</span><b class="mono" id="t-pdv"></b></div>
        <div class="kv big"><span>Ukupno za plaćanje</span><b class="mono" id="t-uk"></b></div>
        <div class="kv"><span>Avans po prihvatanju</span><b class="mono" id="t-av"></b></div>
      </div>
    </div>
  </div>`;
}
function rerenderEd(){const u=edU();document.getElementById('editor').innerHTML=editorHTML(u);}
function edF(i,f,val){const x=edV().stavke[i];
  if(f==='st'){x.st=val;}else if(f==='rupe'){x.o.rupe=Math.max(0,+val||0);}else{x[f]=Math.max(0,+val||0);}
  updRow(i);updTot();}
function edO(i,k){const x=edV().stavke[i];x.o[k]=x.o[k]?0:1;
  if(k==='brus'&&x.o.brus)x.o.faz=0; if(k==='faz'&&x.o.faz)x.o.brus=0; // brušenje i fazeta se isključuju
  rerenderEd();}
function dodajStavku(){const v=edV();const p=v.stavke[v.stavke.length-1];
  v.stavke.push(p?JSON.parse(JSON.stringify({...p,opis:'Pozicija '+(v.stavke.length+1)})):{opis:'Pozicija 1',st:'f6',s:1000,v:1000,kom:1,o:{brus:1}});rerenderEd();}
function updRow(i){const x=edV().stavke[i],c=calcSt(x);
  const e=id=>document.getElementById(id);if(!e('m2-'+i))return;
  e('m2-'+i).textContent=fmt(c.m2);e('iz-'+i).textContent=fmt(c.sum);
  e('brk-'+i).innerHTML=c.parts.map(p=>`${p.n} ${fmt(p.q)} ${p.j} × ${fmt(p.c)} = <b>${fmt(p.iz)}</b>`).join(' · ')+(x.s*x.v/1e6<MIN_M2&&x.s&&x.v?` <span class="pill amber" style="padding:0 7px">obračunato min ${String(MIN_M2).replace('.',',')} m²/kom</span>`:'');}
function updTot(){const v=edV(),t=calcV(v),e=id=>document.getElementById(id);if(!e('t-st'))return;
  e('t-m2').textContent=fmt(t.m2);e('t-st').textContent=fmt(t.st);e('t-us').textContent=fmt(t.us);
  e('t-rab').textContent=t.rab?'− '+fmt(t.rab):'0,00';e('t-osn').textContent=fmt(t.osn);e('t-pdv').textContent=fmt(t.pdv);
  e('t-uk').textContent=fmt(t.uk)+' KM';e('t-av').textContent=fmt(t.uk*(v.avans||0)/100)+' KM';
  v.usl.forEach((x,i)=>{const el=e('ui-'+i);if(el)el.textContent=fmt(uslItem(x.k).c*x.kol);});
  e('ruta').innerHTML=rutaIz(v).map((s,i)=>`${i?ic('arrow',12):''}<span class="pill ${['komplet','isporuka'].includes(s)?'gray':'blue'}">${STANICE[s].n}</span>`).join('');}

/* ---------- AKCIJE NA UPITU ---------- */
function upAkt(u,t,tip,ko){u.akt.push({t,d:DANAS+' '+new Date().toTimeString().slice(0,5),ko:ko||u.kom,tip});}
function biljeska(id){const el=document.getElementById('bilj');if(!el.value.trim())return;const u=UPITI.find(x=>x.id===id);upAkt(u,el.value.trim(),'biljeska');openUpit(id,1);}
function napraviPonudu(id){const u=UPITI.find(x=>x.id===id);
  if(u.mjer&&!u.mjer.done){u.mjer.done=true;upAkt(u,'Mjerenje na terenu urađeno, mjere unesene','mjerenje',u.mjer.ekipa);}
  const t=JSON.parse(JSON.stringify(TEMPL[u.tip]||{stavke:[{opis:'Pozicija 1',st:'f6',s:1000,v:1000,kom:1,o:{brus:1}}],usl:[{k:'dost',kol:1}]}));
  const ku=kupacOf(u.kupac);
  u.verzije.push({v:1,datum:DANAS,poslata:null,vazi:null,rabat:ku?ku.uslovi.rabat:0,avans:ku?ku.uslovi.avans:50,rok:'10 radnih dana',nap:'',...t});
  u.status='izrada';upAkt(u,'Ponuda v1 u izradi','ponuda');
  openUpit(id);toast('Ponuda otvorena: unesi pozicije, cijena se računa sama');
  setTimeout(()=>document.getElementById('editor').scrollIntoView({behavior:'smooth'}),50);}
function novaVerzija(id){const u=UPITI.find(x=>x.id===id);const n=JSON.parse(JSON.stringify(zadnja(u)));
  n.v++;n.datum=DANAS;n.poslata=null;n.vazi=null;u.verzije.push(n);u.status='izrada';
  upAkt(u,`Nova verzija v${n.v} (izmjena na zahtjev kupca)`,'ponuda');openUpit(id);toast(`Napravljena v${n.v}. Prethodna verzija ostaje sačuvana.`);}
function potvrdiMjerenje(id){const u=UPITI.find(x=>x.id===id),g=k=>document.getElementById(k).value;

function naStanici(n,s){

  return s==='isporuka'&&n.status==='spremno';
}

  const st=FILT&&FILT.startsWith('st:')?FILT.slice(3):null;

// u logistiku ulaze SAMO nalozi završeni u proizvodnji (status spremno/isporuceno).
// n.isp = plan izlaska: {tip, datum, vrijeme, ekipa, adresa, nap, status: zakazano | teren | isporuceno}
const TERENSKI=EKIPE.concat(['Kombi (Dragan)']);
const ISP_ST={zakazano:['blue','Zakazano'],teren:['green','Na terenu'],isporuceno:['gray','Isporučeno']};
const ispPill=n=>n.isp?`<span class="pill ${ISP_ST[n.isp.status][0]}">${n.isp.status==='isporuceno'&&n.montaza?'Montirano':ISP_ST[n.isp.status][1]}</span>`:'<span class="pill amber">Čeka zakazivanje</span>';
const tipPill=n=>`<span class="pill ${n.montaza?'violet':'gray'}">${n.montaza?'Montaža':'Dostava'}</span>`;
const ispBack=id=>{if(CUR==='nalog')openNalog(id);else go('logistika');};
// izlasci na teren: isporuke/montaže + mjerenja iz prodaje (isti raspored ekipa)
function izlasci(){
  const a=NALOZI.filter(n=>n.isp&&n.isp.status!=='isporuceno').map(n=>({dat:n.isp.datum,vr:n.isp.vrijeme,ekipa:n.isp.ekipa,n,
    t:`${n.id} · ${n.proizvod}`,s:`${n.kupac} · ${n.isp.adresa}`,on:`openNalog('${n.id}')`}));
  const m=UPITI.filter(u=>u.status==='mjerenje'&&u.mjer&&!u.mjer.done).map(u=>({dat:u.mjer.datum,vr:u.mjer.vrijeme,ekipa:u.mjer.ekipa,u,
    t:`Mjerenje · ${u.naslov}`,s:`${u.kupac} · ${u.grad}`,on:`openUpit('${u.id}')`}));
  return a.concat(m).sort((x,y)=>pd(x.dat)-pd(y.dat)||x.vr.localeCompare(y.vr));
}
function danNaziv(d){const x=dana(d);return x===0?'Danas':x===-1?'Sutra':['nedjelja','ponedjeljak','utorak','srijeda','četvrtak','petak','subota'][pd(d).getDay()];}
function viewLogistika(){
  const ceka=NALOZI.filter(n=>n.status==='spremno'&&!n.isp);
  const iz=izlasci(), danas=iz.filter(x=>x.dat===DANAS), teren=NALOZI.filter(n=>n.isp&&n.isp.status==='teren');
  const gotovo=NALOZI.filter(n=>n.status==='isporuceno');
  const dani=[...new Set(iz.map(x=>x.dat))];
  const akc=n=>n.isp.status==='zakazano'
    ?`<button class="btn sm" onclick="event.stopPropagation();krenuli('${n.id}')">Krenuli</button><button class="btn sm ghost" onclick="event.stopPropagation();openModal(modalZakazi('${n.id}'))">Pomjeri</button>`
    :`<button class="btn sm" onclick="event.stopPropagation();openModal(modalIsporuceno('${n.id}'))">${ic('check',14)} ${n.montaza?'Montirano':'Isporučeno'}</button>`;
  return `
  <div class="kpi-grid">
    <div class="kpi ${ceka.some(n=>dana(n.rok)>0)?'alert':ceka.length?'warn':''}" style="cursor:default"><div class="ico amber">${ic('box')}</div><div class="num">${ceka.length}</div><div class="lab">Gotovo, čeka zakazivanje</div></div>
    <div class="kpi" style="cursor:default"><div class="ico blue">${ic('clock')}</div><div class="num">${danas.length}</div><div class="lab">Izlazaka danas</div></div>

}
function modalZakazi(id){const n=NALOZI.find(x=>x.id===id),k=kupacOf(n.kupac),p=n.isp||{};
  const adrese=(k?k.objekti.map(o=>o.n+', '+o.a):[]).concat(k?[k.adresa+', '+k.grad]:[n.grad]);
  return `
  <div class="modal-h"><b>${n.isp?'Pomjeri':'Zakaži'} ${n.montaza?'montažu':'isporuku'} · ${n.id}</b><button class="x" onclick="closeModal()">✕</button></div>
  <div class="modal-b">
    <div class="kv"><span>Kupac</span><b>${n.kupac}</b></div>
    <div class="kv"><span>Šta</span><b>${n.proizvod}</b></div>
    <div class="grid-2" style="gap:12px;margin-top:12px">
      <div class="fld"><label>Vrsta</label><select id="zk-tip"><option value="m" ${n.montaza?'selected':''}>Montaža (naša ekipa)</option><option value="d" ${!n.montaza?'selected':''}>Dostava</option></select></div>
      <div class="fld"><label>Ekipa / vozilo</label><select id="zk-e">${TERENSKI.map(e=>`<option ${p.ekipa===e||(!p.ekipa&&!n.montaza&&e.startsWith('Kombi'))?'selected':''}>${e}</option>`).join('')}</select></div>
      <div class="fld"><label>Datum</label><input id="zk-d" value="${p.datum||addD(DANAS,1)}"></div>
      <div class="fld"><label>Vrijeme</label><input id="zk-v" value="${p.vrijeme||'08:00'}"></div>
    </div>
    <div class="fld"><label>Adresa</label><select id="zk-a">${[...new Set(adrese)].map(a=>`<option ${p.adresa===a?'selected':''}>${a}</option>`).join('')}</select></div>
    <div class="fld"><label>Napomena za ekipu</label><input id="zk-n" value="${esc(p.nap||'')}" placeholder="npr. najaviti se pola sata ranije"></div>
    <div class="mini-note">${ic('info')}<div>Kupac dobija SMS/mail sa terminom, ekipa vidi izlazak u svom rasporedu.</div></div>
  </div>
  <div class="modal-f"><button class="btn ghost" onclick="closeModal()">Odustani</button><button class="btn" onclick="zakazi('${id}')">${n.isp?'Sačuvaj termin':'Zakaži'}</button></div>`;}
function zakazi(id){const n=NALOZI.find(x=>x.id===id),g=k=>document.getElementById(k).value;
  n.montaza=g('zk-tip')==='m';
  n.isp={tip:n.montaza?'montaza':'dostava',datum:g('zk-d'),vrijeme:g('zk-v'),ekipa:g('zk-e'),adresa:g('zk-a'),nap:g('zk-n'),status:'zakazano'};
  n.log.push({t:`Zakazana ${n.montaza?'montaža':'isporuka'} ${n.isp.datum} u ${n.isp.vrijeme} (${n.isp.ekipa})`,d:'sad · demo'});
  closeModal();buildNav();ispBack(id);toast('Termin zakazan, kupac obaviješten');}
function krenuli(id){const n=NALOZI.find(x=>x.id===id);n.isp.status='teren';
  n.log.push({t:'Ekipa krenula na teren ('+n.isp.ekipa+')',d:'sad · demo'});ispBack(id);toast('Ekipa na terenu');}
function modalIsporuceno(id){const n=NALOZI.find(x=>x.id===id),k=kupacOf(n.kupac);return `
  <div class="modal-h"><b>${n.montaza?'Montirano':'Isporučeno'} · ${n.id}</b><button class="x" onclick="closeModal()">✕</button></div>
  <div class="modal-b">
    <div class="fld"><label>Primio (ime kupca / predstavnika)</label><input id="is-p" value="${k&&k.kontakti[0]?esc(k.kontakti[0].ime):''}"></div>
    <div class="fld"><label>Napomena</label><input id="is-n" placeholder="npr. sve uredno, bez oštećenja"></div>
    <button class="btn ghost sm" onclick="toast('Fotografija sa terena u punoj verziji')">${ic('plus',14)} Fotografija montaže</button>
    <div class="mini-note" style="margin-top:14px">${ic('info')}<div>Nalog se zatvara i ide na fakturisanje ostatka iznosa.</div></div>
  </div>
  <div class="modal-f"><button class="btn ghost" onclick="closeModal()">Odustani</button><button class="btn" onclick="isporuci('${id}')">Potvrdi</button></div>`;}
function isporuci(id){const n=NALOZI.find(x=>x.id===id),g=k=>document.getElementById(k).value.trim();
  n.isp.status='isporuceno';n.isp.primio=g('is-p');if(g('is-n'))n.isp.nap=g('is-n');n.status='isporuceno';n.faza=n.ruta.length-1;
  n.log.push({t:(n.montaza?'Montirano':'Isporučeno')+(n.isp.primio?', primio '+n.isp.primio:''),d:'sad · demo'});
  closeModal();buildNav();ispBack(id);toast('Nalog zatvoren, ide na fakturisanje');}

/* ---------- VIEW: KUPCI ---------- */
const kupacOf=n=>KUPCI.find(k=>k.n===n);
const kLink=n=>kupacOf(n)?`<button class="klink" onclick="event.stopPropagation();openKupac('${kupacOf(n).id}')">${n}</button>`:n;
// finansije kupca iz faktura: otvoreno i dospjelo neplaćeno
function kFin(k){
  const otv=k.fakture.reduce((a,f)=>a+f.iznos-f.pl,0);
  const dosp=k.fakture.filter(f=>f.iznos>f.pl&&dana(f.dosp)>0);
  return {otv,dosp:dosp.reduce((a,f)=>a+f.iznos-f.pl,0),dospDana:dosp.length?Math.max(...dosp.map(f=>dana(f.dosp))):0};
}
function kLive(k){
  const nal=NALOZI.filter(n=>n.kupac===k.n), up=UPITI.filter(u=>u.kupac===k.n);
  const akt=nal.filter(n=>!['spremno','isporuceno'].includes(n.status)), otvP=up.filter(u=>['nov','mjerenje','izrada','poslata'].includes(u.status));
  return {nal,up,akt,otvP,otvV:otvP.reduce((a,u)=>a+(vrijU(u)||0),0)};
}
const TIP_PILL={'Privatno':'gray','Firma':'blue','Izvođač':'violet','Investitor':'violet','Javna ustanova':'amber','Novi':'gray'};
function viewKupci(){
  const tipovi=[...new Set(KUPCI.map(k=>k.tip))];
  const lista=FILT?KUPCI.filter(k=>k.tip===FILT):KUPCI;
  return `
  <div style="margin-bottom:16px"><button class="btn" onclick="openModal(modalKupac())">${ic('plus',16)} Novi kupac</button></div>
  <div class="card">
    <div style="padding:14px 18px 0"><div class="filt">${[[null,'Svi']].concat(tipovi.map(t=>[t,t])).map(([v,l])=>`<button class="${FILT===v?'on':''}" onclick="setFilt('kupci',${v?`'${v}'`:'null'})">${l}<span class="c">${v?KUPCI.filter(k=>k.tip===v).length:KUPCI.length}</span></button>`).join('')}</div></div>
    <div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Kupac</th><th>Tip</th><th>Grad</th><th>Aktivno</th><th style="text-align:right">Promet 2026</th><th style="text-align:right">Otvoreno</th><th>Komerc.</th></tr></thead>
    <tbody>${lista.map(k=>{const f=kFin(k),l=kLive(k);return `<tr class="clickable" onclick="openKupac('${k.id}')">
      <td><div style="display:flex;align-items:center;gap:10px"><div class="avatar-sm">${initials(k.n)}</div><div><b>${k.n}</b><br><span style="color:var(--muted);font-size:11.5px">${k.id} · kupac od ${k.od}.</span></div></div></td>
      <td><span class="pill ${TIP_PILL[k.tip]||'gray'}">${k.tip}</span></td><td>${k.grad}</td>
      <td style="font-size:12.5px">${l.akt.length?`${l.akt.length} ${l.akt.length===1?'nalog':'naloga'}`:''}${l.akt.length&&l.otvP.length?' · ':''}${l.otvP.length?`${l.otvP.length} ${l.otvP.length===1?'upit':'upita'}`:''}${!l.akt.length&&!l.otvP.length?'<span style="color:var(--muted)">—</span>':''}</td>
      <td class="mono" style="text-align:right">${k.ist.god?fmt0(k.ist.god)+' KM':'—'}</td>
      <td class="mono" style="text-align:right">${f.otv?`<span style="color:${f.dosp?'var(--red)':'var(--text)'}">${fmt0(f.otv)} KM</span>${f.dosp?'<br><span class="pill red" style="padding:0 7px;font-size:10.5px">dospjelo</span>':''}`:'—'}</td>
      <td>${k.kom}</td></tr>`}).join('')}</tbody>
  </table></div></div>`;

  // aktivnosti iz svih upita i naloga ovog kupca, najnovije prvo
  const dOf=s=>{const m=/(\d\d)\.(\d\d)\./.exec(s);return m?pd(m[0]):TODAY;};
  const akt=[].concat(
    ...l.up.map(u=>u.akt.map(a=>({t:a.t,d:a.d+' · '+a.ko,ref:u.id,on:`openUpit('${u.id}')`,dt:dOf(a.d)}))),

/* ---------- ISTORIJA (dugme Nazad na telefonu / u browseru) ----------
   Svaki ekran je jedan korak u istoriji. Otvoren prozor ili meni je privremeni korak:
   Nazad ga prvo zatvori, pa tek onda vraća na prethodni ekran. */
let NAV_POP=false, CURST=null;
const stKey=st=>JSON.stringify(st);
function navPush(st){
  const prev=CURST; CURST=st;
  if(NAV_POP)return;
  if(!history.state){history.replaceState(st,'');return;}
  if(prev&&stKey(prev)===stKey(st))return; // ponovni prikaz istog ekrana (osvježavanje poslije akcije)
  history.pushState(st,'');
}
const modalShown=()=>document.getElementById('modalBg').classList.contains('show');
const sbShown=()=>document.getElementById('sidebar').classList.contains('open');
{
  const _go=go,_nal=openNalog,_upit=openUpit,_kup=openKupac,_tab=setPTab,_filt=setFilt,_om=openModal,_cm=closeModal,_sb=toggleSb;
  go=function(k,f){_go(k,f);navPush(k==='prodaja'?{v:'go',k,f:f||null,t:PTAB}:{v:'go',k,f:f||null});};
  openNalog=function(id){_nal(id);navPush({v:'nalog',id});};
  openUpit=function(id,keepV){_upit(id,keepV);navPush({v:'upit',id});};
  openKupac=function(id){_kup(id);navPush({v:'kupac',id});};
  setPTab=function(t){_tab(t);navPush({v:'go',k:'prodaja',f:null,t});};
  // filter ne pravi novi korak, samo se pamti na trenutnom ekranu
  setFilt=function(k,v,toList){_filt(k,v,toList);CURST=k==='prodaja'?{v:'go',k,f:v||null,t:PTAB}:{v:'go',k,f:v||null};if(!NAV_POP)history.replaceState(CURST,'');};
  openModal=function(html,wide){const was=modalShown();_om(html,wide);if(!was&&!NAV_POP)history.pushState(Object.assign({},CURST,{m:1}),'');};
  closeModal=function(){_cm();if(history.state&&history.state.m)history.replaceState(CURST,'');};
  toggleSb=function(open){const was=sbShown();_sb(open);
    if(open&&!was)history.pushState(Object.assign({},CURST,{sb:1}),'');
    else if(!open&&history.state&&history.state.sb)history.replaceState(CURST,'');};
}
addEventListener('popstate',e=>{
  if(modalShown()){closeModal();return;}
  if(sbShown()){toggleSb(false);return;}
  const st=e.state;if(!st)return;
  const scr=Object.assign({},st);delete scr.m;delete scr.sb;
  if(CURST&&stKey(scr)===stKey(CURST)){history.back();return;} // prazan korak od zatvorenog prozora
  NAV_POP=true;
  try{
    if(scr.v==='nalog')openNalog(scr.id);
    else if(scr.v==='upit')openUpit(scr.id);
    else if(scr.v==='kupac')openKupac(scr.id);
    else{go(scr.k,scr.f);if(scr.k==='prodaja'&&scr.t&&scr.t!==PTAB){PTAB=scr.t;document.getElementById('content').innerHTML=viewProdaja();}}
    CURST=scr;
  }finally{NAV_POP=false;}
});

  function flush(){if(!q.length)return;var p=JSON.stringify({sid:sid,vid:vid,own:own,slug:SLUG,href:location.href,ref:document.referrer,w:screen.width,h:screen.height,q:q});q=[];try{if(navigator.sendBeacon)navigator.sendBeacon(EP,p);else fetch(EP,{method:'POST',body:p,keepalive:true});}catch(_){}}

  document.addEventListener('click',function(ev){try{
    var el=ev.target.closest&&ev.target.closest('a,button,.kpi,.card,.ncard,.rtask,[data-open],[onclick],tr[onclick],.chip,.btn');
    if(!el) return;
    if(el.hasAttribute&&el.hasAttribute('data-view')) return;        // promjena sekcije -> hvata se kao 'view'
    var oc=(el.getAttribute&&el.getAttribute('onclick'))||'';
    if(/setView\(/.test(oc)) return;
    var lbl=(el.getAttribute&&el.getAttribute('data-open'))||'';
    if(!lbl) lbl=(el.textContent||'').replace(/\s+/g,' ').trim().slice(0,50);
    var cls=(((el.className&&el.className.baseVal!==undefined)?el.className.baseVal:el.className)||el.tagName||'')+'';
    push('click',{lbl:lbl,cls:cls.split(' ')[0]});
  }catch(_){}},true);
  document.addEventListener('visibilitychange',function(){try{
    if(document.visibilityState==='hidden'){ accrue(); visible=false; push('hide',{view:curView,total:Date.now()-t0,sections:secMs}); flush(); }
    else { visible=true; segStart=Date.now(); }
  }catch(_){}});
  window.addEventListener('pagehide',function(){try{ accrue(); push('end',{view:curView,total:Date.now()-t0,sections:secMs}); flush(); }catch(_){}});
  setInterval(flush,8000);
}catch(_){}})();
