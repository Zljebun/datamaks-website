<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Datamaks — prototip privremeno nedostupan</title>
<style>
  :root{
    --bg1:#eef5ff; --bg2:#dde9f8; --bg3:#c7d9ee;
    --ink:#0f2238; --mut:#51657d; --line:rgba(15,34,56,.12);
    --accent:#1f6feb; --card:rgba(255,255,255,.72);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    display:flex; align-items:center; justify-content:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:540px; background:var(--card);
    border:1px solid var(--line); border-radius:20px; padding:40px 34px;
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 18px 48px -18px rgba(15,34,56,.35);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); text-align:center;
  }
  .brand{display:inline-flex; align-items:center; gap:9px; margin-bottom:26px}
  .mark{width:13px; height:13px; border-radius:4px; background:linear-gradient(135deg,var(--accent),#7aa7f5); box-shadow:0 0 0 3px rgba(31,111,235,.14)}
  .brand b{font-size:15px; letter-spacing:.14em; font-weight:700}
  h1{font-size:21px; line-height:1.3; margin:0 0 14px; font-weight:650}
  p{font-size:15px; line-height:1.62; color:var(--mut); margin:0 0 14px}
  .divider{height:1px; background:var(--line); margin:26px 0 22px}
  .contact{display:flex; flex-direction:column; gap:11px; align-items:center}
  .contact a{color:var(--accent); text-decoration:none; font-weight:600; font-size:15px}
  .contact a:hover{text-decoration:underline}
  .row{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--mut)}
  .foot{margin-top:26px; font-size:12px; color:var(--mut); opacity:.8}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg1:#0b1726; --bg2:#0e1d30; --bg3:#122744; --ink:#eaf1fb; --mut:#9fb2cc;
      --line:rgba(255,255,255,.12); --accent:#6fa8ff; --card:rgba(18,32,52,.66);
    }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark"></span><b>DATAMAKS</b></div>
    <h1>Ovaj prototip trenutno nije javno dostupan.</h1>
    <p>Pristup prikazu je privremeno zatvoren. Ukoliko želite da pogledate prototip ili zakažete prezentaciju, slobodno nas kontaktirajte i rado ćemo vam ga ponovo otvoriti.</p>
    <div class="divider"></div>
    <div class="contact">
      <a href="mailto:info@datamaks.net">info@datamaks.net</a>
      <a href="https://datamaks.net" target="_blank" rel="noopener">datamaks.net</a>
      <div class="row">+387 65 469 565</div>
    </div>
    <div class="foot">Datamaks d.o.o. &middot; Banja Luka</div>
  </main>
<script>
(function(){try{
  if(!/(^|\.)datamaks\.net$/i.test(location.hostname))return;
  var EP='https://api.datamaks.net/e';
  var get=function(k){try{return localStorage.getItem(k);}catch(_){return null;}};
  var set=function(k,v){try{localStorage.setItem(k,v);}catch(_){}};
  var rid=function(){return Math.random().toString(36).slice(2,10);};
  var vid=get('tp_vid'); if(!vid){vid=rid()+rid(); set('tp_vid',vid);}
  var sid=rid()+Date.now().toString(36);
  var land=/tehnoplast-3d/.test(location.pathname)?'gate3d':'gate2d';
  var q=[{t:'start',r:'gate',ms:0,land:land}];
  function flush(){if(!q.length)return;var p=JSON.stringify({sid:sid,vid:vid,href:location.href,ref:document.referrer,w:screen.width,h:screen.height,q:q});q=[];try{if(navigator.sendBeacon)navigator.sendBeacon(EP,p);else fetch(EP,{method:'POST',body:p,keepalive:true});}catch(_){}}
  flush();
}catch(_){}})();
</script>
</body>
</html>
